<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>背单词 · 三年级英语</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#EFF2F6; --card:#FFFFFF; --soft:#F7F9FC;
    --ink:#141B2D; --ink2:#48536B; --ink3:#8B95AB;
    --line:#E3E8F0; --line2:#CBD3E1;
    --pri:#2E6BE6; --pri-l:#EAF1FE; --pri-d:#1B4BB8;
    --ok:#0E9F6E; --ok-l:#E8F8F2;
    --no:#E02424; --no-l:#FDECEC;
  }
  html{font-size:17px}
  @media(min-width:761px) and (max-width:1120px){ html{font-size:18.5px} }
  @media(max-width:900px){ html{font-size:18px} }
  @media(pointer:coarse){ .qopt{padding:15px 16px} .wcard{min-height:150px} .sitem{padding:11px 12px} }
  body{background:var(--bg);color:var(--ink);line-height:1.75;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .layout{display:flex;align-items:flex-start}

  .side{flex:0 0 258px;width:258px;position:sticky;top:0;height:100vh;overflow-y:auto;
    padding:26px 14px 40px;border-right:1px solid var(--line);background:#F9FBFD}
  .side::-webkit-scrollbar{width:5px}
  .side::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
  .brand{display:block;text-decoration:none;color:var(--ink);padding:0 10px 18px}
  .brand .b1{font-size:1.06rem;font-weight:700;line-height:1.4}
  .brand .b2{font-size:.72rem;color:var(--ink3);margin-top:2px}
  .sitem{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink2);
    border-radius:10px;padding:9px 10px;font-size:.9rem;line-height:1.45;transition:.14s;
    margin-bottom:2px;cursor:pointer;border:none;background:none;font-family:inherit;width:100%;text-align:left}
  .sitem:hover{background:#EDF2FA;color:var(--ink)}
  .sitem .n{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:#E7EDF8;color:#5A6B87;
    font-size:.72rem;font-weight:700;display:grid;place-items:center}
  .sitem .t{flex:1;min-width:0}
  .sitem .pg{flex:0 0 auto;font-size:.7rem;color:var(--ink3)}
  .sitem.on{background:var(--pri);color:#fff;font-weight:600}
  .sitem.on .n{background:rgba(255,255,255,.22);color:#fff}
  .sitem.on .pg{color:rgba(255,255,255,.85)}
  .sback{display:block;margin:14px 10px 0;font-size:.78rem;color:var(--ink3);text-decoration:none}
  .sback:hover{color:var(--pri)}

  .main{flex:1;min-width:0;padding:26px 30px 90px 26px}
  .frame{background:var(--card);border-radius:22px;padding:34px 38px 40px;
    max-width:960px;margin:0 auto;box-shadow:0 1px 3px rgba(20,27,45,.05),0 8px 28px rgba(20,27,45,.04)}

  .kick{font-size:.76rem;font-weight:700;color:var(--pri);letter-spacing:1.4px;margin-bottom:8px}
  h1{font-size:1.7rem;font-weight:700;letter-spacing:-.4px;line-height:1.4}
  .lead{margin-top:12px;font-size:.9rem;color:var(--ink2);line-height:1.85}
  .lead b{color:var(--ink)}
  .lead .src{display:block;margin-top:8px;font-size:.78rem;color:var(--ink3)}

  .stat{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
  .stat .box{background:var(--soft);border:1px solid var(--line);border-radius:12px;
    padding:11px 17px;font-size:.8rem;color:var(--ink2)}
  .stat .box b{display:block;font-size:1.35rem;color:var(--pri);line-height:1.3;font-weight:700}
  .stat .box.ok b{color:var(--ok)}

  .tabs{display:flex;gap:10px;margin-top:26px}
  .tab{font:inherit;font-size:.95rem;font-weight:700;padding:10px 24px;border-radius:11px;
    border:1.5px solid var(--line);background:var(--soft);color:var(--ink2);cursor:pointer;transition:.14s}
  .tab:hover{border-color:var(--line2)}
  .tab.on{background:var(--pri);border-color:var(--pri);color:#fff}

  /* 卡片 */
  .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:24px}
  .wcard{position:relative;background:var(--soft);border:1.5px solid var(--line);border-radius:15px;
    min-height:132px;padding:16px 18px;cursor:pointer;transition:.16s;user-select:none}
  .wcard:hover{border-color:var(--pri);transform:translateY(-2px);box-shadow:0 6px 18px rgba(46,107,230,.12)}
  .wcard .en{font-size:1.25rem;font-weight:700;letter-spacing:.2px}
  .wcard .ph{display:inline-block;font-size:.66rem;font-weight:700;color:var(--ink3);
    border:1px solid var(--line2);border-radius:5px;padding:1px 7px;margin-top:8px}
  .wcard .flip{margin-top:10px;font-size:.92rem;color:var(--ink2);line-height:1.7;display:none}
  .wcard .flip .zh{font-weight:700;color:var(--ink);font-size:1.02rem}
  .wcard .flip .ex{display:block;margin-top:6px;color:var(--ink3);font-size:.84rem}
  .wcard.open .flip{display:block}
  .wcard.mastered{border-color:var(--ok);background:var(--ok-l)}
  .wcard .mk{position:absolute;top:12px;right:13px;width:22px;height:22px;border-radius:50%;
    background:var(--ok);color:#fff;font-size:.72rem;display:none;place-items:center;font-weight:700}
  .wcard.mastered .mk{display:grid}
  .wcard.mastered .en{color:#08694A}

  /* 考一考 */
  .quiz{margin-top:24px}
  .qword{background:var(--soft);border:1.5px solid var(--line);border-radius:15px;
    padding:26px 24px;text-align:center}
  .qword .big{font-size:2rem;font-weight:800;letter-spacing:.5px}
  .qword .hint{font-size:.8rem;color:var(--ink3);margin-top:6px}
  .qopts{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}
  .qopt{font:inherit;font-size:1.02rem;padding:15px 16px;border-radius:12px;cursor:pointer;
    border:1.5px solid var(--line2);background:#fff;color:var(--ink);transition:.14s;text-align:center}
  .qopt:hover:not(:disabled){border-color:var(--pri);background:var(--pri-l)}
  .qopt:disabled{cursor:default}
  .qopt.ok{border-color:var(--ok);background:var(--ok-l);color:#08694A;font-weight:700}
  .qopt.no{border-color:var(--no);background:var(--no-l);color:#9B1C1C}
  .qfb{margin-top:16px;font-size:.92rem;line-height:1.8;border-radius:11px;padding:13px 17px;display:none}
  .qfb.show{display:block}
  .qfb.ok{background:var(--ok-l);color:#08694A;border-left:4px solid var(--ok)}
  .qfb.no{background:var(--no-l);color:#9B1C1C;border-left:4px solid var(--no)}
  .qfb b{font-weight:800}
  .qfb .ex{display:block;margin-top:5px;color:var(--ink2);font-size:.86rem}
  .pips{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
  .pip{width:20px;height:6px;border-radius:3px;background:#E3E8F0}
  .pip.on{background:var(--ok)}
  .next{margin-top:16px;font:inherit;font-size:.95rem;font-weight:700;padding:11px 30px;
    border-radius:11px;border:none;background:var(--pri);color:#fff;cursor:pointer;display:none}
  .next:hover{background:var(--pri-d)}
  .next.show{display:inline-block}

  .empty{text-align:center;padding:50px 20px}
  .empty .big{font-size:2.4rem;color:var(--ok);margin-bottom:14px}
  .empty h2{font-size:1.2rem;margin-bottom:8px}
  .empty p{font-size:.9rem;color:var(--ink2);line-height:1.9}

  @media(max-width:900px){
    .layout{display:block}
    .side{position:static;width:auto;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:14px 12px}
    .main{padding:16px 12px 70px}
    .frame{padding:22px 18px 26px;border-radius:14px}
    .qopts{grid-template-columns:1fr}
  }
</style>

<script>const BOOK = {"title": "译林版 · 英语 · 三年级上册", "edition": "2024 年 7 月第 1 版（2026 年 7 月第 3 次印刷）", "isbn": "978-7-5753-0037-7", "intro": "<b>怎么用：</b>三年级是英语零起点，先听说、后认读。每个单元先看 Big question 和句型讲解，再做对应练习。答错的题看解析里的中文说明，跟读几遍再回来重做。<br><b>顺序建议：</b>第一至四单元（打招呼、问名字、确认身份、介绍朋友）是全册的地基，第五至八单元（家庭、生日、表达能做的事）建立在它们之上；字母认读与书写贯穿全册，每天读几个。<br><b>说明：</b>本页所有练习均为自主练习，不计排名、不设考试。", "units": [{"n": 1, "t": "Hello!"}, {"n": 2, "t": "What's your name?"}, {"n": 3, "t": "Are you Su Hai?"}, {"n": 4, "t": "This is my friend"}, {"n": 5, "t": "She's my mother"}, {"n": 6, "t": "Is he your grandpa?"}, {"n": 7, "t": "Happy Birthday!"}, {"n": 8, "t": "I can do this for you"}], "totalQ": 592, "hasMidterm": true, "hasFinal": true}; const WORDS = [{"u": 1, "ut": "Hello!", "words": [{"w": "hello", "zh": "你好", "ex": "Hello!", "type": "word"}, {"w": "hi", "zh": "嗨（更随意）", "ex": "Hi, I'm Bobby.", "type": "word"}, {"w": "morning", "zh": "早上", "ex": "Good morning.", "type": "word"}, {"w": "goodbye", "zh": "再见", "ex": "Goodbye!", "type": "word"}, {"w": "name", "zh": "名字", "ex": "What's your name?", "type": "word"}, {"w": "I'm", "zh": "我是（I am 的缩写）", "ex": "Hi, I'm Bobby.", "type": "phrase"}, {"w": "my name is", "zh": "我的名字叫", "ex": "My name is Beibei.", "type": "phrase"}]}, {"u": 2, "ut": "What's your name?", "words": [{"w": "what's", "zh": "是什么（What is 的缩写）", "ex": "What's your name?", "type": "phrase"}, {"w": "your", "zh": "你的", "ex": "What's your name?", "type": "word"}, {"w": "welcome", "zh": "欢迎", "ex": "Welcome to our class!", "type": "word"}, {"w": "our", "zh": "我们的", "ex": "Welcome to our class!", "type": "word"}, {"w": "class", "zh": "班级", "ex": "Welcome to our class!", "type": "word"}, {"w": "new", "zh": "新的", "ex": "A new classmate.", "type": "word"}, {"w": "play", "zh": "玩", "ex": "Let's play!", "type": "word"}, {"w": "let's", "zh": "让我们（Let us 的缩写）", "ex": "Let's play!", "type": "phrase"}]}, {"u": 3, "ut": "Are you Su Hai?", "words": [{"w": "are", "zh": "是（你/你们）", "ex": "Are you Jake?", "type": "word"}, {"w": "you", "zh": "你；你们", "ex": "Are you Jake?", "type": "word"}, {"w": "yes", "zh": "是的", "ex": "Yes, I am.", "type": "word"}, {"w": "no", "zh": "不是", "ex": "No, I'm not.", "type": "word"}, {"w": "sorry", "zh": "对不起", "ex": "Sorry!", "type": "word"}, {"w": "twins", "zh": "双胞胎", "ex": "You're twins!", "type": "word"}, {"w": "he", "zh": "他", "ex": "He's my friend.", "type": "word"}, {"w": "she", "zh": "她", "ex": "She's my friend.", "type": "word"}]}, {"u": 4, "ut": "This is my friend", "words": [{"w": "this", "zh": "这；这位", "ex": "This is Sam.", "type": "word"}, {"w": "my", "zh": "我的", "ex": "This is my friend.", "type": "word"}, {"w": "friend", "zh": "朋友", "ex": "This is my friend Zhang Hua.", "type": "word"}, {"w": "teacher", "zh": "老师", "ex": "This is my teacher.", "type": "word"}, {"w": "nice", "zh": "高兴的；好的", "ex": "Nice to meet you.", "type": "word"}, {"w": "meet", "zh": "遇见", "ex": "Nice to meet you.", "type": "word"}, {"w": "too", "zh": "也", "ex": "Nice to meet you, too.", "type": "word"}]}, {"u": 5, "ut": "She's my mother", "words": [{"w": "family", "zh": "家庭", "ex": "This is my family.", "type": "word"}, {"w": "father", "zh": "爸爸", "ex": "He's my father.", "type": "word"}, {"w": "mother", "zh": "妈妈", "ex": "She's my mother.", "type": "word"}, {"w": "brother", "zh": "哥哥或弟弟", "ex": "He's my brother.", "type": "word"}, {"w": "sister", "zh": "姐姐或妹妹", "ex": "She's my sister.", "type": "word"}, {"w": "grandpa", "zh": "爷爷或外公", "ex": "He's my grandpa.", "type": "word"}, {"w": "grandma", "zh": "奶奶或外婆", "ex": "She's my grandma.", "type": "word"}, {"w": "look", "zh": "看", "ex": "Look!", "type": "word"}]}, {"u": 6, "ut": "Is he your grandpa?", "words": [{"w": "uncle", "zh": "叔叔或舅舅", "ex": "He's my uncle.", "type": "word"}, {"w": "aunt", "zh": "阿姨或姑姑", "ex": "She's my aunt.", "type": "word"}, {"w": "me", "zh": "我", "ex": "This is me.", "type": "word"}, {"w": "he's", "zh": "他是（He is 的缩写）", "ex": "He's my father.", "type": "phrase"}, {"w": "she's", "zh": "她是（She is 的缩写）", "ex": "She's my mother.", "type": "phrase"}, {"w": "isn't", "zh": "不是（is not 的缩写）", "ex": "No, he isn't.", "type": "phrase"}]}, {"u": 7, "ut": "Happy Birthday!", "words": [{"w": "birthday", "zh": "生日", "ex": "Happy Birthday!", "type": "word"}, {"w": "happy", "zh": "快乐的", "ex": "Happy Birthday!", "type": "word"}, {"w": "old", "zh": "……岁的", "ex": "How old are you?", "type": "word"}, {"w": "how", "zh": "怎样", "ex": "How old are you?", "type": "word"}, {"w": "for", "zh": "给；为", "ex": "This is for you.", "type": "word"}, {"w": "thank", "zh": "谢谢", "ex": "Thank you.", "type": "word"}, {"w": "one", "zh": "一", "ex": "I'm one.", "type": "word"}, {"w": "two", "zh": "二", "ex": "I'm two.", "type": "word"}, {"w": "three", "zh": "三", "ex": "I'm three.", "type": "word"}, {"w": "four", "zh": "四", "ex": "I'm four.", "type": "word"}, {"w": "five", "zh": "五", "ex": "I'm five.", "type": "word"}, {"w": "six", "zh": "六", "ex": "I'm six.", "type": "word"}, {"w": "seven", "zh": "七", "ex": "I'm seven.", "type": "word"}, {"w": "eight", "zh": "八", "ex": "I'm eight.", "type": "word"}, {"w": "nine", "zh": "九", "ex": "I'm nine.", "type": "word"}, {"w": "ten", "zh": "十", "ex": "I'm ten.", "type": "word"}]}, {"u": 8, "ut": "I can do this for you", "words": [{"w": "can", "zh": "能；会", "ex": "I can swim.", "type": "word"}, {"w": "can't", "zh": "不会（cannot 的缩写）", "ex": "No, I can't.", "type": "phrase"}, {"w": "run", "zh": "跑", "ex": "I can run.", "type": "word"}, {"w": "jump", "zh": "跳", "ex": "I can jump.", "type": "word"}, {"w": "swim", "zh": "游泳", "ex": "I can swim.", "type": "word"}, {"w": "dance", "zh": "跳舞", "ex": "I can dance.", "type": "word"}, {"w": "sing", "zh": "唱歌", "ex": "I can sing.", "type": "word"}, {"w": "fly", "zh": "飞", "ex": "I can't fly.", "type": "word"}, {"w": "table", "zh": "桌子", "ex": "I can clean the table.", "type": "word"}, {"w": "clean", "zh": "擦干净；打扫", "ex": "I can clean the table.", "type": "word"}]}];</script>
<script>
(function(){
  const KEY = "english3.words.v1" + (__USER ? "." + __USER : "");
  const NEED = 3;

  function stAll(){
    try{ return JSON.parse(localStorage.getItem(KEY) || "{}"); }
    catch(e){ return {}; }
  }
  function stWrite(o){
    try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){}
  }
  function el(t,c,x){ const e=document.createElement(t); if(c)e.className=c; if(x!==undefined)e.textContent=x; return e; }

  /* 展平：wid → {w, zh, ex, type, u, ut} */
  const FLAT = [];
  WORDS.forEach(function(g){
    (g.words||[]).forEach(function(w, i){
      FLAT.push({ id:"u"+g.u+"w"+i, w:w.w, zh:w.zh, ex:w.ex,
                  type:w.type||"word", u:g.u, ut:g.ut });
    });
  });
  const byId = {};
  FLAT.forEach(function(x){ byId[x.id] = x; });

  let cur = 0;                      /* 当前组下标，WORDS.length 表示「全部」 */
  let mode = "cards";
  let quiz = null;                  /* 当前考题 */
  let currentId = null;             /* 一词一关：当前聚焦的词，答对留在关内，答错或掌握后换词 */

  function groupWords(){
    return cur === WORDS.length ? FLAT : FLAT.filter(function(x){ return x.u === WORDS[cur].u; });
  }
  function isMastered(id){
    const s = stAll()[id];
    return s && s.streak >= NEED;
  }

  /* 侧栏 */
  function buildNav(){
    const nav = document.getElementById("snav");
    nav.innerHTML = "";
    WORDS.forEach(function(g, i){
      const a = el("button","sitem" + (i===cur?" on":""));
      a.type = "button";
      a.innerHTML = '<span class="n"></span><span class="t"></span><span class="pg"></span>';
      a.querySelector(".n").textContent = g.u;
      a.querySelector(".t").textContent = g.ut;
      a.querySelector(".pg").textContent = masteredCount(g.u) + "/" + g.words.length;
      a.onclick = function(){ cur = i; quiz = null; render(); };
      nav.appendChild(a);
    });
    const all = el("button","sitem" + (cur===WORDS.length?" on":""));
    all.type = "button";
    all.innerHTML = '<span class="n" style="font-size:.66rem">全</span><span class="t">全部复习</span><span class="pg"></span>';
    all.querySelector(".pg").textContent = masteredCount(null) + "/" + FLAT.length;
    all.onclick = function(){ cur = WORDS.length; quiz = null; render(); };
    nav.appendChild(all);
  }
  function masteredCount(u){
    return FLAT.filter(function(x){ return (u===null || x.u===u) && isMastered(x.id); }).length;
  }

  function render(){
    buildNav();
    const stat = document.getElementById("stat");
    const lead = document.getElementById("lead");
    const gw = groupWords();
    const m = gw.filter(function(x){ return isMastered(x.id); }).length;

    lead.innerHTML = "先<b>看卡片</b>：点卡片翻面，读英文、看中文、读例句。觉得会了就去<b>考一考</b>——" +
      "一次只考一个词，<b>连续答对 " + NEED + " 次</b>（方向会轮换）就标记为已掌握，然后换下一个词。" +
      "中途答错，连对次数清零并换词。" +
      '<span class="src">词汇来源：本工具台从已核课文句型中提取的常用词（共 ' + FLAT.length +
      ' 词），不是课本官方词汇表；待课本词表页核对后校正。</span>';

    stat.innerHTML =
      '<div class="box"><b>'+gw.length+'</b>本组词数</div>' +
      '<div class="box ok"><b>'+m+'</b>已掌握</div>' +
      '<div class="box"><b>'+(gw.length-m)+'</b>待巩固</div>';

    document.getElementById("cardsBox").style.display = mode==="cards" ? "" : "none";
    document.getElementById("quizBox").style.display = mode==="quiz" ? "" : "none";
    if(mode==="cards") renderCards(gw);
    else renderQuiz(gw);
  }

  /* ───── 看卡片 ───── */
  function renderCards(gw){
    const box = document.getElementById("cardsBox");
    box.innerHTML = "";
    const grid = el("div","wgrid");
    gw.forEach(function(x){
      const c = el("div","wcard" + (isMastered(x.id)?" mastered":""));
      c.appendChild(el("div","en",x.w));
      c.appendChild(el("span","ph", x.type==="phrase" ? "句型" : "单词"));
      const flip = el("div","flip");
      flip.innerHTML = '<span class="zh"></span><span class="ex"></span>';
      flip.querySelector(".zh").textContent = x.zh;
      flip.querySelector(".ex").textContent = x.ex;
      c.appendChild(flip);
      const mk = el("span","mk","\u2713");
      c.appendChild(mk);
      c.onclick = function(){ c.classList.toggle("open"); };
      grid.appendChild(c);
    });
    box.appendChild(grid);
    if(!gw.length){
      box.appendChild(el("div","empty","这一组还没有词汇。"));
    }
  }

  /* ───── 考一考 ───── */
  function pickQuiz(gw){
    const pool = gw.filter(function(x){ return !isMastered(x.id); });
    const use = pool.length ? pool : gw;
    if(!use.length) return null;
    /* 一词一关：上一次答对的词继续考（方向随机换），直到连对 NEED 次或答错换词 */
    let target = currentId && byId[currentId] && !isMastered(currentId) && use.some(function(x){ return x.id===currentId; })
      ? byId[currentId] : null;
    if(!target){
      target = use[Math.floor(Math.random()*use.length)];
      currentId = target.id;
    }
    const enToZh = Math.random() < 0.5;
    /* 干扰项：同组其他词，不足时从全部词补 */
    let others = gw.filter(function(x){ return x.id !== target.id; });
    if(others.length < 3){
      const extra = FLAT.filter(function(x){ return x.id !== target.id && x.type === target.type; });
      others = others.concat(extra);
    }
    others = others.filter(function(x, i){
      return others.findIndex(function(y){ return y.zh === x.zh; }) === i;
    });
    others.sort(function(){ return Math.random()-0.5; });
    const distractors = others.slice(0, 3);
    const options = distractors.map(function(x){
      return enToZh ? x.zh : x.w;
    });
    const answer = enToZh ? target.zh : target.w;
    options.push(answer);
    options.sort(function(){ return Math.random()-0.5; });
    return { target: target, enToZh: enToZh, options: options, answer: answer };
  }

  function renderQuiz(gw){
    const box = document.getElementById("quizBox");
    box.innerHTML = "";
    const pending = gw.filter(function(x){ return !isMastered(x.id); });
    if(!gw.length){
      box.appendChild(el("div","empty","这一组还没有词汇。"));
      return;
    }
    if(!pending.length){
      const e = el("div","empty");
      e.innerHTML = '<div class="big">\u2713</div><h2>这一组全部掌握了！</h2>' +
        '<p>' + gw.length + ' 个词都连续答对 ' + NEED + ' 次。可以去左侧换一组，' +
        '或者过几天回来在「全部复习」里再检验一次。</p>';
      box.appendChild(e);
      return;
    }

    quiz = pickQuiz(gw);
    const q = el("div","quiz");
    const head = el("div","qword");
    if(quiz.enToZh){
      head.innerHTML = '<div class="big"></div><div class="hint">选出正确的中文意思</div>';
      head.querySelector(".big").textContent = quiz.target.w;
    } else {
      head.innerHTML = '<div class="big"></div><div class="hint">选出正确的英文</div>';
      head.querySelector(".big").textContent = quiz.target.zh;
    }
    q.appendChild(head);

    const opts = el("div","qopts");
    quiz.options.forEach(function(op){
      const b = el("button","qopt",op);
      b.type = "button";
      b.onclick = function(){ judge(op, b, opts, qfb, gw); };
      opts.appendChild(b);
    });
    q.appendChild(opts);

    const qfb = el("div","qfb");
    q.appendChild(qfb);

    const next = el("button","next","下一题");
    next.type = "button";
    next.onclick = function(){ renderQuiz(gw); };
    q.appendChild(next);
    box.appendChild(q);
  }

  function judge(op, btn, opts, qfb, gw){
    const ok = op === quiz.answer;
    [...opts.children].forEach(function(b){
      b.disabled = true;
      if(b.textContent === quiz.answer) b.classList.add("ok");
      else if(b === btn && !ok) b.classList.add("no");
    });

    const all = stAll();
    const rec = all[quiz.target.id] || { streak:0, wrong:0 };
    const qfbEl = qfb;

    if(ok){
      rec.streak = (rec.streak||0) + 1;
      rec.ts = Date.now();
      if(rec.streak >= NEED) currentId = null;   /* 掌握，下一题换新词 */
      let pipsHtml = '<span class="pips">';
      for(let i=0;i<NEED;i++) pipsHtml += '<span class="pip'+(i<rec.streak?" on":"")+'"></span>';
      pipsHtml += '</span>';
      if(rec.streak >= NEED){
        qfbEl.className = "qfb show ok";
        qfbEl.innerHTML = '<b>\u2713 答对了！</b>连续答对 '+NEED+' 次，「'+quiz.target.w+
          '」已标记为掌握。'+pipsHtml+'<span class="ex"></span>';
        qfbEl.querySelector(".ex").textContent = quiz.target.ex;
      } else {
        qfbEl.className = "qfb show ok";
        qfbEl.innerHTML = '<b>\u2713 答对了！</b>再答对 '+(NEED-rec.streak)+' 次就掌握。'+pipsHtml+
          '<span class="ex"></span>';
        qfbEl.querySelector(".ex").textContent = quiz.target.ex;
      }
    } else {
      rec.streak = 0;
      rec.wrong = (rec.wrong||0) + 1;
      rec.ts = Date.now();
      currentId = null;                          /* 答错换词，避免刚看答案就重考 */
      qfbEl.className = "qfb show no";
      qfbEl.innerHTML = '<b>\u2717 答错了</b>正确答案：<b>'+quiz.answer+'</b>' +
        '<span class="ex"></span><span style="font-size:.82rem;display:block;margin-top:4px">连对次数已清零。</span>';
      qfbEl.querySelector(".ex").textContent = quiz.target.w + " — " + quiz.target.zh + "　·　" + quiz.target.ex;
    }
    all[quiz.target.id] = rec;
    stWrite(all);

    qfbEl.parentNode.querySelector(".next").classList.add("show");
    /* 刷新统计与侧栏进度 */
    const gwNow = groupWords();
    document.getElementById("stat").innerHTML =
      '<div class="box"><b>'+gwNow.length+'</b>本组词数</div>' +
      '<div class="box ok"><b>'+gwNow.filter(function(x){ return isMastered(x.id); }).length+'</b>已掌握</div>' +
      '<div class="box"><b>'+(gwNow.length-gwNow.filter(function(x){ return isMastered(x.id); }).length)+'</b>待巩固</div>';
    buildNav();
  }

  document.getElementById("tabCards").onclick = function(){
    mode = "cards";
    this.classList.add("on");
    document.getElementById("tabQuiz").classList.remove("on");
    render();
  };
  document.getElementById("tabQuiz").onclick = function(){
    mode = "quiz";
    this.classList.add("on");
    document.getElementById("tabCards").classList.remove("on");
    render();
  };

  render();
})();
</script>
</body>
</html>
