<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>统编版三年级上册 · 语文</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#EFF2F6; --card:#FFFFFF; --soft:#F7F9FC;
    --ink:#141B2D; --ink2:#48536B; --ink3:#8B95AB;
    --line:#E3E8F0; --line2:#CBD3E1;
    --pri:#2E6BE6; --pri-l:#EAF1FE; --pri-d:#1B4BB8;
    --ok:#0E9F6E; --ok-l:#E8F8F2;
    --no:#E02424; --no-l:#FDECEC;
    --warn:#C27803; --warn-l:#FFF7E6; --warn-b:#FBE3B0;
    --adv:#7C3AED; --adv-l:#F3EEFF; --adv-b:#DDD0FE;
    --r-lg:22px; --r-md:14px; --r-sm:10px;
  }
  html{font-size:17px}
  body{background:var(--bg);color:var(--ink);line-height:1.75;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}

  .layout{display:flex;align-items:flex-start}

  /* ───── 左侧栏 ───── */
  .side{flex:0 0 258px;width:258px;position:sticky;top:0;height:100vh;overflow-y:auto;
    padding:26px 14px 40px;border-right:1px solid var(--line);background:#F9FBFD}
  .side::-webkit-scrollbar{width:5px}
  .side::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
  .brand{display:block;text-decoration:none;color:var(--ink);padding:0 10px 18px}
  .brand .b1{font-size:1.06rem;font-weight:700;letter-spacing:-.2px;line-height:1.4}
  .brand .b2{font-size:.72rem;color:var(--ink3);margin-top:2px;letter-spacing:.3px}
  .sgroup{font-size:.7rem;font-weight:700;color:var(--ink3);letter-spacing:1.2px;
    padding:16px 10px 7px}
  .sitem{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink2);
    border-radius:var(--r-sm);padding:9px 10px;font-size:.9rem;line-height:1.45;
    transition:.14s;margin-bottom:2px}
  .sitem:hover{background:#EDF2FA;color:var(--ink)}
  .sitem .n{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:#E7EDF8;color:#5A6B87;
    font-size:.72rem;font-weight:700;display:grid;place-items:center;transition:.14s}
  .sitem .t{flex:1;min-width:0}
  .sitem .q{font-size:.68rem;color:var(--ink3);flex:0 0 auto}
  .sitem .wb{background:#FDECEC;color:#C81E1E;font-size:.66rem;font-weight:700;
    border-radius:9px;padding:0 6px;margin-left:4px;line-height:1.75}
  .sitem.on{background:var(--pri);color:#fff;font-weight:600}
  .sitem.on .n{background:rgba(255,255,255,.22);color:#fff}
  .sitem.on .q{color:rgba(255,255,255,.8)}
  .sitem .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--line2);margin:0 8px 0 3px}
  .sitem:hover .dot{background:var(--pri)}
  .sback{display:block;margin:14px 10px 0;font-size:.78rem;color:var(--ink3);text-decoration:none}

  /* 侧栏顶部用户条 */
  .snav{padding-right:14px}
  .side .userbar{margin:0 22px 16px 4px;padding:9px 10px;gap:9px;border-radius:12px;background:#fff}
  .side .userbar .avatar{width:32px;height:32px;font-size:.92rem}
  .side .userbar .uname{font-size:.86rem;line-height:1.3}
  .side .userbar .usub{display:none}
  .side .userbar .ustar{padding:3px 8px;gap:4px;border-radius:9px}
  .side .userbar .ustar svg{width:13px;height:13px}
  .side .userbar .ustar b{font-size:.9rem}
  .side .userbar .ustar .lbl{font-size:.64rem}

  /* 侧栏：单元子目录 */
  .ssub{margin:3px 0 9px 12px;padding-left:9px;border-left:1px solid var(--line2)}
  .ssub .s2{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink2);
    border-radius:8px;padding:6px 8px;font-size:.82rem;line-height:1.5;transition:.14s;margin-bottom:1px}
  .ssub .s2:hover{background:#EDF2FA;color:var(--ink)}
  .ssub .s2 .k{flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:#E7EDF8;color:#5A6B87;
    font-size:.64rem;font-weight:700;display:grid;place-items:center;transition:.14s}
  .ssub .s2 .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ssub .s2.on{background:var(--pri);color:#fff;font-weight:600}
  .ssub .s2.on .k{background:rgba(255,255,255,.24);color:#fff}
  .ssub .s2.sd .k{width:7px;height:7px;background:var(--line2);margin:0 5px 0 1px}
  .ssub .s2.sd.on .k{background:rgba(255,255,255,.75)}
  .sback:hover{color:var(--pri)}

  /* ───── 主区 ───── */
  .main{flex:1;min-width:0;padding:26px 30px 90px 26px}
  .frame{background:var(--card);border-radius:var(--r-lg);padding:34px 38px 40px;
    max-width:1060px;margin:0 auto;box-shadow:0 1px 3px rgba(20,27,45,.05),0 8px 28px rgba(20,27,45,.04)}

  /* 用户条 */
  .userbar{display:flex;align-items:center;gap:14px;background:var(--soft);
    border:1px solid var(--line);border-radius:var(--r-md);padding:13px 18px;margin-bottom:22px}
  .avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
    font-size:1.15rem;font-weight:700;color:#fff;cursor:pointer;flex:0 0 auto;
    box-shadow:inset 0 -2px 6px rgba(0,0,0,.14);transition:.15s}
  .avatar:hover{transform:scale(1.07)}
  .uinfo{flex:1;min-width:0}
  .uname{font-size:1rem;font-weight:700;cursor:pointer;display:inline-block;line-height:1.4}
  .uname:hover{color:var(--pri)}
  .uname .pen{font-size:.7rem;color:var(--ink3);margin-left:5px;font-weight:400}
  .usub{font-size:.76rem;color:var(--ink3);margin-top:2px}
  .ustar{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:7px 16px 7px 12px;flex:0 0 auto}
  .ustar svg{width:20px;height:20px}
  .ustar svg path{fill:#F5A524}
  .ustar b{font-size:1.15rem;color:#B4460E;font-variant-numeric:tabular-nums;line-height:1}
  .ustar .lbl{font-size:.72rem;color:var(--ink3)}

  .uhead{margin-bottom:26px}
  .ukicker{font-size:.76rem;font-weight:700;color:var(--pri);letter-spacing:1.4px;margin-bottom:8px}
  .uhead h1{font-size:1.72rem;font-weight:700;letter-spacing:-.4px;line-height:1.4}
  .umeta{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;font-size:.76rem;color:var(--ink2)}
  .chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
  .uprog{margin-top:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .bar{flex:1;min-width:180px;height:9px;background:#E7ECF4;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#2E6BE6,#0E9F6E);transition:width .4s ease}
  .pnum{font-size:.82rem;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pnum b{color:var(--pri);font-size:1rem}

  /* 视频 */
  .videos{margin:26px 0 6px}
  .vhead{display:flex;align-items:baseline;gap:10px;font-size:.92rem;font-weight:700;
    color:var(--ink);margin-bottom:12px}
  .vhead .hint{font-weight:400;font-size:.76rem;color:var(--ink3)}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:11px}
  .vcard{background:var(--soft);border:1px solid var(--line);border-radius:var(--r-md);
    padding:15px 17px 13px;text-decoration:none;color:inherit;display:flex;flex-direction:column;
    gap:8px;transition:.15s;position:relative;min-height:118px}
  .vcard:hover{border-color:var(--pri);background:#F0F5FF;transform:translateY(-2px);
    box-shadow:0 4px 16px rgba(46,107,230,.13)}
  .vcard .arw{position:absolute;top:13px;right:15px;color:var(--line2);font-size:.85rem;line-height:1}
  .vcard:hover .arw{color:var(--pri)}
  .vtop{display:flex;align-items:center;gap:7px;padding-right:18px}
  .vtag{font-size:.66rem;font-weight:700;letter-spacing:.5px;border-radius:5px;padding:2px 7px;
    background:var(--pri-l);color:var(--pri-d)}
  .vcard .vt{font-size:.98rem;font-weight:700;line-height:1.5;color:var(--ink)}
  .vkw{display:flex;flex-wrap:wrap;gap:5px}
  .kw{font-size:.72rem;background:#E9EFF8;color:#4A5A75;border-radius:5px;padding:2px 7px;line-height:1.6}
  .vmeta{display:flex;justify-content:space-between;align-items:center;
    font-size:.72rem;color:var(--ink3);margin-top:auto;padding-top:3px;gap:8px}
  .vmeta .dur{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink2)}

  /* 主分区标签 */
  .main-tabs{display:flex;gap:7px;margin:24px 0 22px;background:var(--soft);
    border:1px solid var(--line);border-radius:15px;padding:5px}
  .mtab{flex:1;font:inherit;font-size:.94rem;font-weight:700;color:var(--ink2);
    background:none;border:none;border-radius:11px;padding:12px 8px;cursor:pointer;
    transition:.15s;line-height:1.4}
  .mtab:hover:not(.on){color:var(--ink);background:#E9EFF9}
  .mtab.on{background:#fff;color:var(--pri);box-shadow:0 1px 5px rgba(20,27,45,.11)}
  .mtab .sub{display:block;font-size:.7rem;font-weight:400;color:var(--ink3);margin-top:2px}
  .mtab.on .sub{color:var(--pri)}
  .pane{display:none;animation:fade .2s ease}
  .pane.show{display:block}

  /* 知识点标签 */
  .kptabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 20px;
    padding-bottom:18px;border-bottom:1px solid var(--line)}
  .kptab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);
    background:var(--soft);border-radius:999px;padding:8px 15px 8px 9px;cursor:pointer;
    font:inherit;font-size:.86rem;color:var(--ink2);transition:.15s}
  .kptab:hover{border-color:var(--line2);background:#EDF2FA;color:var(--ink)}
  .kptab .idx{width:24px;height:24px;border-radius:50%;background:#DDE5F2;color:#5A6B87;
    font-size:.72rem;font-weight:700;display:grid;place-items:center;flex:0 0 auto;transition:.15s}
  .kptab.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600;
    box-shadow:0 3px 12px rgba(46,107,230,.28)}
  .kptab.on .idx{background:rgba(255,255,255,.24);color:#fff}

  /* 知识点块 */
  .kp{display:none;animation:fade .22s ease}
  .kp.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .kp-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .kp-head h2{font-size:1.3rem;font-weight:700;letter-spacing:-.2px;line-height:1.4;flex:1;min-width:180px}
  .diff{font-size:.72rem;color:var(--warn);letter-spacing:2px}

  .kp-body{display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr);gap:26px;align-items:start}
  @media(max-width:1080px){.kp-body{grid-template-columns:1fr;gap:20px}}

  .kp-left{display:flex;flex-direction:column;gap:11px}
  .panel{border-radius:var(--r-md);padding:15px 17px;border:1px solid var(--line);background:var(--soft)}
  .panel .label{font-size:.72rem;font-weight:700;letter-spacing:.8px;color:var(--ink3);margin-bottom:7px}
  .panel p{font-size:.94rem;line-height:1.85;color:var(--ink2)}
  .panel ul{margin:0;padding-left:19px}
  .panel li{font-size:.9rem;line-height:1.8;color:var(--ink2);margin-bottom:4px}
  .panel.fm{background:var(--pri-l);border-color:#C3D8FF}
  .panel.fm .label{color:var(--pri-d)}
  .panel.fm p{color:var(--pri-d);font-weight:600;font-size:.98rem;line-height:1.75}
  .panel.bad{background:#FFF8F8;border-color:#FBD5D5}
  .panel.bad .label{color:var(--no)}
  .panel.tip{background:var(--warn-l);border-color:var(--warn-b)}
  .panel.tip .label{color:var(--warn)}

  .qgroup{margin-bottom:18px}
  .qgroup-title{display:flex;align-items:center;gap:9px;font-size:.78rem;font-weight:700;
    letter-spacing:.5px;color:var(--ink3);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:2px}
  .qgroup.adv .qgroup-title{color:var(--adv);border-bottom-color:var(--adv-b)}
  .tagv{background:var(--adv-l);color:var(--adv);font-size:.68rem;font-weight:700;
    border-radius:5px;padding:2px 7px;letter-spacing:.4px}
  .qgroup.chal .qgroup-title{color:#B4460E;border-bottom-color:#F8D3BC}
  .tagc{background:#FFF0E6;color:#B4460E;font-size:.68rem;font-weight:700;
    border-radius:5px;padding:2px 7px;letter-spacing:.4px}

  .q{padding:16px 0;border-bottom:1px dashed #E9EDF4}
  .q:last-child{border-bottom:none;padding-bottom:2px}
  .q.adv{background:linear-gradient(90deg,rgba(124,58,237,.05),transparent 55%);
    margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:10px}
  .q.chal{background:linear-gradient(90deg,rgba(180,70,14,.06),transparent 55%);
    margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:10px}
  .q-top{display:flex;gap:11px;align-items:flex-start;margin-bottom:12px}
  .q-no{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#E9EEF6;color:var(--ink2);
    font-size:.78rem;font-weight:700;display:grid;place-items:center;margin-top:2px;transition:.2s}
  .q.adv .q-no{background:var(--adv-l);color:var(--adv)}
  .q.chal .q-no{background:#FFF0E6;color:#B4460E}
  .q-txt{font-size:1rem;line-height:1.8;color:var(--ink);flex:1}
  .q.done .q-no{background:var(--ok);color:#fff}
  .q.fail .q-no{background:var(--no);color:#fff}
  .q.done{background:rgba(14,159,110,.045);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:10px}

  .opts{display:flex;flex-direction:column;gap:8px;margin-left:37px}
  .opt{text-align:left;font:inherit;font-size:.94rem;color:var(--ink2);background:#fff;
    border:1.5px solid var(--line2);border-radius:var(--r-sm);padding:11px 15px;cursor:pointer;
    display:flex;gap:11px;align-items:flex-start;transition:.14s;line-height:1.7}
  .opt:hover:not(:disabled){border-color:var(--pri);background:var(--pri-l);transform:translateX(2px)}
  .opt b{color:var(--ink3);font-weight:700;flex:0 0 auto}
  .opt:disabled{cursor:default;transform:none}
  .opt.ok{border-color:var(--ok);background:var(--ok-l);color:#08694A}
  .opt.ok b{color:var(--ok)}
  .opt.no{border-color:var(--no);background:var(--no-l);color:#9B1C1C}
  .opt.no b{color:var(--no)}
  .opt.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d);font-weight:600}
  .opt.on b{color:var(--pri)}

  .inp-row{display:flex;gap:9px;margin-left:37px;align-items:center;flex-wrap:wrap}
  .inp-row input{font:inherit;font-size:1rem;width:130px;padding:10px 14px;border:1.5px solid var(--line2);
    border-radius:var(--r-sm);outline:none;transition:.14s;color:var(--ink)}
  .inp-row input:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(46,107,230,.12)}
  .inp-row input:disabled{background:#F4F6FA;color:var(--ink2)}
  .inp-row .unit-tag{font-size:.92rem;color:var(--ink3)}
  .btn{font:inherit;font-size:.88rem;font-weight:600;padding:9px 20px;border-radius:var(--r-sm);
    cursor:pointer;border:1.5px solid var(--pri);background:var(--pri);color:#fff;transition:.14s}
  .btn:hover{background:var(--pri-d);border-color:var(--pri-d)}
  .btn:disabled{background:#E6EAF1;border-color:#E6EAF1;color:#9AA5B8;cursor:default}

  .fb{margin:11px 0 0 37px;font-size:.9rem;line-height:1.8;border-radius:10px;padding:11px 15px;display:none}
  .fb.show{display:block}
  .fb.ok{background:var(--ok-l);color:#08694A;border-left:4px solid var(--ok)}
  .fb.no{background:var(--no-l);color:#9B1C1C;border-left:4px solid var(--no)}
  .fb .tk{font-weight:700;margin-right:6px}

  /* 侧栏收起 */
  .side-toggle{position:fixed;left:246px;top:14px;z-index:40;width:26px;height:46px;
    border-radius:0 9px 9px 0;background:#fff;border:1px solid var(--line);border-left:none;
    cursor:pointer;display:grid;place-items:center;color:var(--ink3);font-size:11px;
    transition:.2s;padding:0;font-family:inherit}
  .side-toggle:hover{color:var(--pri);background:var(--pri-l)}
  .side-toggle li{list-style:none}
  .layout.side-off .side{width:0;flex-basis:0;padding:0;overflow:hidden;border-right:none;opacity:0}
  .layout.side-off .side-toggle{left:0}
  .layout.side-off .main{padding-left:34px}

  /* 视频折叠 */
  .vhead{cursor:pointer;user-select:none}
  .vhead .tg{font-size:.72rem;color:var(--pri);font-weight:600;margin-left:auto}
  .vgrid.hide{display:none}

  /* 知识点两栏：左固定右滚动 */
  .kp-body{display:grid;grid-template-columns:minmax(0,0.88fr) minmax(0,1.12fr);gap:26px;align-items:start}
  .kp-left{position:sticky;top:14px;display:flex;flex-direction:column;gap:11px}
  .kp-right{max-height:calc(100vh - 40px);overflow-y:auto;padding-right:6px}
  .kp-right::-webkit-scrollbar{width:7px}
  .kp-right::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
  .kp-right::-webkit-scrollbar-track{background:#F2F5F9;border-radius:9px}
  @media(max-width:1080px){
    .kp-body{grid-template-columns:1fr;gap:18px}
    .kp-left{position:static}
    .kp-right{max-height:none;overflow:visible;padding-right:0}
  }

  /* 限时测验 */
  .quizbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--soft);
    border:1px solid var(--line);border-radius:var(--r-md);padding:13px 18px;margin:18px 0 6px}
  .quizbar .tm{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;
    color:var(--pri);letter-spacing:.5px;line-height:1}
  .quizbar .tm.warn{color:var(--no);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.4}}
  .quizbar .meta{font-size:.8rem;color:var(--ink2);flex:1;min-width:120px}
  .quizbar .meta b{color:var(--ink)}
  .startbtn{font:inherit;font-size:1rem;font-weight:700;padding:13px 34px;border-radius:12px;
    border:none;background:var(--pri);color:#fff;cursor:pointer;transition:.15s;
    box-shadow:0 4px 14px rgba(46,107,230,.28)}
  .startbtn:hover{background:var(--pri-d);transform:translateY(-1px)}
  .startbtn:disabled{background:#D7DEEA;box-shadow:none;transform:none;cursor:default}

  .result{margin-top:20px;background:linear-gradient(160deg,#F8FBFF,#FFFFFF);
    border:1px solid #C3D8FF;border-radius:var(--r-lg);padding:26px 28px}
  .result .top{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .result .sc{font-size:2.6rem;font-weight:700;color:var(--pri-d);line-height:1;
    font-variant-numeric:tabular-nums}
  .result .sc small{font-size:.9rem;font-weight:400;color:var(--ink3);margin-left:4px}
  .stars{display:flex;gap:7px}
  .star{width:30px;height:30px;position:relative}
  .star svg{width:100%;height:100%}
  .star.on svg path{fill:#F5A524}
  .star.off svg path{fill:#E3E8F0}
  .result .lv{font-size:.95rem;font-weight:700;color:#B4460E}
  .result .sub{font-size:.82rem;color:var(--ink2);margin-top:6px}
  .result h3{font-size:1rem;font-weight:700;margin:22px 0 10px;padding-top:16px;
    border-top:1px dashed var(--line2)}
  .wlist{display:flex;flex-direction:column;gap:10px}
  .wrow{background:#FFF8F8;border:1px solid #FBD5D5;border-radius:10px;padding:13px 16px}
  .wrow .q{font-size:.94rem;line-height:1.7;margin-bottom:7px;padding:0;border:none;background:none}
  .wrow .ans{font-size:.84rem;color:var(--ink2);line-height:1.8}
  .wrow .ans .bad{color:var(--no);font-weight:600}
  .wrow .ans .good{color:var(--ok);font-weight:600}
  .wrow .exp{font-size:.84rem;color:var(--ink2);margin-top:5px;line-height:1.8}

  /* 自测 / 检测卷 */
  .block{margin-top:40px;padding-top:32px;border-top:1px solid var(--line)}

    align-items:baseline;gap:12px;flex-wrap:wrap}

  .unitnav{display:flex;justify-content:space-between;gap:12px;margin-top:44px}

  .unitnav a:hover{border-color:var(--pri);color:var(--pri-d);background:var(--pri-l)}
  .unitnav a .k{display:block;font-size:.72rem;color:var(--ink3);margin-bottom:3px}
  .unitnav a.next{text-align:right}

  footer{text-align:center;font-size:.76rem;color:var(--ink3);padding:30px 0 0;line-height:1.9}
  .reset{font:inherit;font-size:.76rem;color:var(--ink3);background:none;border:none;
    text-decoration:underline;cursor:pointer;margin-top:8px}
  .reset:hover{color:var(--no)}

  /* 移动端：侧栏转顶部横条 */

    .side{position:static;width:auto;height:auto;border-right:none;border-bottom:1px solid var(--line);
      padding:14px 12px 12px;background:#F9FBFD}

    .snav::-webkit-scrollbar{display:none}
    .sitem{flex:0 0 auto;margin-bottom:0;white-space:nowrap;font-size:.82rem;padding:7px 12px 7px 8px}
    .sitem .q{display:none}

    .uhead h1{font-size:1.35rem}
    .kp-body{gap:18px}
    .opts,.inp-row,.fb{margin-left:0}

  }

<script>const BOOK = {"title": "统编版 · 语文 · 三年级上册", "edition": "2025 年 6 月第 1 版（2026 年 7 月第 2 次印刷）", "isbn": "978-7-107-39754-7", "intro": "<b>怎么用：</b>按单元顺序往下走，每个单元先看知识点讲解，再做题。答错的题会立刻给出解析，错的字要动手写一遍，不要只看。<br><b>顺序建议：</b>第二、七单元（六首古诗）要背熟默对；第三单元是阅读策略单元，练的是“预测要有依据”，不是背故事；第六、七单元的“找关键句、围绕一个意思写”是习作地基；第八单元第一次学文言文，先读通再理解。<br><b>说明：</b>本页所有练习均为自主练习，不计排名、不设考试。", "units": [{"n": 1, "t": "学校生活"}, {"n": 2, "t": "金秋时节"}, {"n": 3, "t": "预测"}, {"n": 4, "t": "童话世界"}, {"n": 5, "t": "留心观察"}, {"n": 6, "t": "祖国山河"}, {"n": 7, "t": "自然之美"}, {"n": 8, "t": "美好品质"}], "totalQ": 664, "hasMidterm": true, "hasFinal": true}; const DATA = {"unitNumber": 2, "unitTitle": "金秋时节", "sections": ["古诗三首", "铺满金色巴掌的水泥道", "秋天的雨", "听听，秋的声音", "习作：写日记", "语文园地二"], "note": "本单元有三首必背古诗，还要学写日记。古诗要会背、会默、会讲意思。", "knowledgePoints": [{"id": "chinese-tongbian-g3up-u2-kp1", "title": "古诗三首：从景物读懂秋天", "short": "山行·赠刘景文·夜书所见", "difficulty": 3, "sections": ["古诗三首"], "core_concept": "三首古诗都写秋天，但写的景物和心情不一样：《山行》写枫叶比二月花还红，诗人停下脚步舍不得走，是喜爱；《赠刘景文》写荷谢菊残却还有傲霜的枝，是在鼓励朋友；《夜书所见》听见秋风、看见篱笆边的灯火，想的是家乡，是思念。", "key_formula": "读古诗三步：找景物（枫叶、残荷、梧叶）→ 想画面（诗人看到了什么）→ 猜心情（他为什么停下、为什么夜不能寐）", "common_mistakes": ["默写错字：『擎雨盖』写成『敬雨盖』，『篱落』写成『离落』，『萧萧』写成『箫箫』", "把『停车坐爱枫林晚』的『坐』理解成『坐下』，其实是『因为』", "把『橙黄橘绿』当成两种颜色，它说的是橙子黄、橘子绿的季节（秋末冬初）"], "tips": "默写古诗后逐字检查一遍，最容易错的是『擎、篱、萧、促』这四个字。", "questions": [{"type": "choice", "difficulty": 1, "question": "『停车坐爱枫林晚』中『坐』的意思是：", "options": ["因为", "坐下", "座位"], "answer": "A", "explanation": "古诗文里的『坐爱』是『因为喜爱』。诗人停下车，是因为太爱傍晚的枫林了。"}, {"type": "choice", "difficulty": 2, "question": "《山行》中，诗人说霜叶比什么还红？", "options": ["二月的鲜花", "天边的晚霞", "春天的太阳"], "answer": "A", "explanation": "『霜叶红于二月花』：经霜的枫叶比二月里的鲜花还要红。"}, {"type": "input", "difficulty": 2, "question": "《赠刘景文》：荷尽已无擎雨盖，菊残犹有____枝。", "answer": "傲霜", "explanation": "荷花谢了，荷叶不再像伞盖；菊花谢了，但枝条还傲然挺立在寒霜里。"}, {"type": "input", "difficulty": 2, "question": "《夜书所见》中，『知有儿童____促织』写的是孩子捉蟋蟀。", "answer": "挑", "explanation": "『挑』读 tiǎo，是捉的意思。促织就是蟋蟀。"}, {"type": "choice", "difficulty": 3, "question": "《夜书所见》中『江上秋风动客情』的『客』指谁？", "options": ["漂泊在外的诗人自己", "江上的船夫", "捉蟋蟀的儿童"], "answer": "A", "explanation": "诗人离家在外，秋风一起，勾起了他对家乡的思念，所以说动了『客』情。"}, {"type": "choice", "difficulty": 3, "question": "三首诗都写秋天。哪一首写的是诗人对朋友的鼓励？", "options": ["《赠刘景文》", "《山行》", "《夜书所见》"], "answer": "A", "explanation": "苏轼写『一年好景君须记』，是告诉朋友：一年中最好的景致正是橙黄橘绿之时，你要乐观。这是对朋友的鼓励。"}, {"type": "input", "difficulty": 3, "question": "默写《山行》第一句：远上寒山____，白云生处有人家。", "answer": "石径斜", "explanation": "石径斜：石头小路弯弯曲曲地伸向远方。『径』是石字旁加圣。"}, {"type": "choice", "level": "advance", "difficulty": 3, "question": "『萧萧梧叶送寒声』里的『寒』字，让你感觉到：", "options": ["秋天夜晚的凉意和诗人心里的冷清", "天气马上要下雪了", "诗人很怕冷"], "answer": "A", "explanation": "一个『寒』字既是身体的感受，也是心里的孤独，这叫一字传情。"}, {"type": "input", "level": "advance", "difficulty": 3, "question": "《赠刘景文》先写荷、菊凋残，再写橙黄橘绿。先抑后扬是为了____朋友。（填两个字）", "answer": "鼓励", "explanation": "先写衰败，再指出最好的景致，是劝朋友乐观——这是鼓励的诗。"}, {"type": "input", "level": "challenge", "difficulty": 4, "question": "《夜书所见》里诗人『夜书所见』，他『见』到的景物是：____一灯明。（按课文填四个字）", "answer": "夜深篱落", "explanation": "诗人深夜见到篱笆下的灯火，由此想到孩子们在捉蟋蟀。"}]}, {"id": "chinese-tongbian-g3up-u2-kp2", "title": "用多种方法理解词语", "short": "不懂的词有五招", "difficulty": 2, "sections": ["铺满金色巴掌的水泥道", "秋天的雨"], "core_concept": "遇到不理解的词语，有五种办法：查字典；联系上下文猜；把词拆成两个字分别理解再合起来；联系生活经验想一想；找它的近义词。方法越多，读书越不怕生词。", "key_formula": "五招解词：查字典 / 联系上下文 / 拆词组词 / 联系生活 / 找近义词", "common_mistakes": ["只认识『查字典』一种方法", "猜了词义却不去课文里验证", "把『凌乱』只理解成『很乱』，丢了『不整齐、没有秩序』的意思"], "tips": "理解词语后，试着用它说一句话，才算真正掌握。", "questions": [{"type": "choice", "difficulty": 1, "question": "遇到不认识的字，最可靠的方法是什么？", "options": ["查字典", "跳过去", "问同学要答案"], "answer": "A", "explanation": "查字典最可靠，不过也要会用其他方法，因为有些词字典里的意思要放进句子才贴切。"}, {"type": "choice", "difficulty": 2, "question": "『地板还是湿漉漉的』，用联系生活的方法理解『湿漉漉』，你会想到：", "options": ["物体湿得往下滴水或很潮湿的样子", "一种地板的名字", "很干净的意思"], "answer": "A", "explanation": "联系生活：刚拖过的地、淋过雨的头发都是湿漉漉的。"}, {"type": "choice", "difficulty": 2, "question": "理解『明朗』（天空是那么明朗），用找近义词的方法，最接近的是：", "options": ["晴朗清爽", "黑暗", "阴沉"], "answer": "A", "explanation": "明朗：光线充足、开阔明亮。近义词是晴朗。"}, {"type": "choice", "difficulty": 3, "question": "『金黄的落叶铺在路上，构成了一幅多彩的图画』。理解『铺满』，用拆词法：『铺』是把东西展开摊平，『满』是全部覆盖。合起来是：", "options": ["摊开的东西把表面全盖住了", "把东西叠起来", "把东西扫干净"], "answer": "A", "explanation": "拆开理解再合起来：铺＋满＝摊开并全部盖住。"}, {"type": "input", "difficulty": 2, "question": "『叶子落在水泥道上，黏在鞋底』的『黏』，近义词是____。（填一个字）", "answer": "粘", "explanation": "黏和粘意思相近，都是像胶水一样贴住不掉。"}, {"type": "true_false", "difficulty": 2, "question": "同一个词在不同句子里意思可能不一样，所以要联系上下文。", "answer": "对", "explanation": "比如『深』，水深、夜深、深红色，意思都不同，上下文才是最好的老师。"}, {"type": "choice", "level": "advance", "difficulty": 3, "question": "理解『五彩缤纷』，下面哪种方法用错了？", "options": ["把五个字拆开一个一个查", "联系课文：秋雨把很多颜色给了植物", "找近义词：五颜六色"], "answer": "A", "explanation": "『五彩缤纷』要整体理解，拆开单查没有意义。拆词法适合能拆的词。"}, {"type": "input", "level": "advance", "difficulty": 3, "question": "用『凌乱』造句：风把落叶吹得____。（填两个字，与凌乱呼应）", "answer": "乱飞", "explanation": "答案不唯一，关键是句子要表现出『不整齐、没秩序』。"}, {"type": "input", "level": "challenge", "difficulty": 4, "question": "课文里『明朗』『凌乱』都是写秋天的词。选一个，用『查字典或联系上下文』说出它的意思（填：明朗就是天气____）。", "answer": "晴朗", "explanation": "明朗：光线充足、开阔明亮，近义词晴朗。"}]}, {"id": "chinese-tongbian-g3up-u2-kp3", "title": "写日记：格式与内容", "short": "先写日期再写事", "difficulty": 2, "sections": ["习作：写日记"], "core_concept": "日记有三条规矩：一、第一行写日期、星期、天气；二、正文另起一行，开头空两格；三、写自己当天真实看到的、做过的、想到的，写清楚一件事和自己的感受。日记是写给自己的，不用编造。", "key_formula": "日期星期天气 + 空两格 + 一件事 + 我的感受 = 一篇合格的日记", "common_mistakes": ["忘了写日期和天气", "写成流水账：起床、吃饭、上学、睡觉", "编造没发生过的事"], "tips": "日记不用长，把最难忘的那一件事和当时的心情写清楚，就是好日记。", "questions": [{"type": "choice", "difficulty": 1, "question": "日记第一行应该写什么？", "options": ["日期、星期、天气", "题目和作者", "我的名字和年龄"], "answer": "A", "explanation": "日记第一行写日期、星期几、天气，方便以后翻看时知道是哪一天的事。"}, {"type": "choice", "difficulty": 2, "question": "下面哪一篇日记的写法是对的？", "options": ["写今天帮妈妈提菜时手有多酸、心里多高兴", "写『今天我起床了，然后吃饭了，然后上学了』", "写一个没发生过的冒险故事"], "answer": "A", "explanation": "日记要写真实的一件事和自己的感受。B 是流水账，C 是编造。"}, {"type": "true_false", "difficulty": 1, "question": "日记的正文开头要空两格。", "answer": "对", "explanation": "空两格是正文起段的规矩，日记也一样。"}, {"type": "true_false", "difficulty": 2, "question": "日记必须写自己看到的、做过的真实事情。", "answer": "对", "explanation": "日记是写给自己的，真实才有意思；编故事是习作的事，不是日记的事。"}, {"type": "input", "difficulty": 2, "question": "日记写完一件事后，最后最好写一写自己的____。（填两个字）", "answer": "感受", "explanation": "感受让日记不只是记事，还能看出你是怎么想的。"}, {"type": "choice", "difficulty": 3, "question": "同一件事写进日记，下面哪种写法最好？", "options": ["第一次帮奶奶穿针，手一直抖，穿了五次才穿进去，奶奶夸我有耐心", "今天我帮奶奶做事了", "今天天气很好"], "answer": "A", "explanation": "A 把经过写具体（手抖、五次），还写出了感受（奶奶夸我），这样的事才值得一记。"}, {"type": "choice", "level": "advance", "difficulty": 3, "question": "下面这篇日记开头正确的是：", "options": ["10月26日 星期一 晴", "星期一、晴", "今天天气好"], "answer": "A", "explanation": "日记第一行要写日期、星期、天气，内容要全。"}, {"type": "input", "level": "advance", "difficulty": 3, "question": "日记写『今天我学会了包饺子』，正文应重点写：怎么包的、遇到什么困难、____。（填两个字）", "answer": "感受", "explanation": "过程加感受，日记才有味道。"}, {"type": "input", "level": "challenge", "difficulty": 4, "question": "同一天发生三件事：上课被表扬、中午吃了面条、帮同学捡了橡皮。日记选哪件最值得写？（填：帮同学捡橡皮，因为这是____的事）", "answer": "难忘", "explanation": "日记选最有感受、最难忘的事写，不选平平淡淡的。"}]}, {"id": "chinese-tongbian-g3up-u2-kp4", "title": "比喻与拟人", "short": "像什么·当人写", "difficulty": 2, "sections": ["铺满金色巴掌的水泥道", "秋天的雨"], "core_concept": "比喻是把一个事物比作另一个相似的事物，句子里常带『像、好像、仿佛』，如『水泥道像铺上了一块彩色的地毯』。拟人是把事物直接当成人来写，让它有人的动作和情感，如『秋天的雨，吹起了金色的小喇叭』。它们都让句子更生动，但写法不同。", "key_formula": "比喻：甲像乙（有本体、喻体）／ 拟人：把物直接当人写（有人的动作）", "common_mistakes": ["见到『像』就说是拟人", "仿写比喻时，本体和喻体完全不像", "拟人句里的事物的动作不像人，也不像它自己"], "tips": "判断拟人有个窍门：看句中的动作是不是人才有的。会『吹喇叭』的一定是人。", "questions": [{"type": "choice", "difficulty": 1, "question": "『水泥道像铺上了一块彩色的地毯』是比喻还是拟人？", "options": ["比喻", "拟人", "都不是"], "answer": "A", "explanation": "把落叶满地的水泥道比作彩色地毯，有『像』，是比喻。"}, {"type": "choice", "difficulty": 2, "question": "『秋天的雨，吹起了金色的小喇叭』是：", "options": ["拟人", "比喻", "夸张"], "answer": "A", "explanation": "雨会吹喇叭，是人做的动作——把秋雨当成人来写，是拟人。"}, {"type": "choice", "difficulty": 2, "question": "下面哪一句是比喻？", "options": ["落叶像一只只金色的蝴蝶", "落叶在跳舞", "风儿唱起了歌"], "answer": "A", "explanation": "A 有『像』，把落叶比作蝴蝶。B、C 没有喻体，是把物当人写，是拟人。"}, {"type": "true_false", "difficulty": 2, "question": "『黄黄的叶子像一把把小扇子，扇哪扇哪，扇走了夏天的炎热』，这句话里既有比喻又有拟人。", "answer": "对", "explanation": "叶子像小扇子是比喻；『扇哪扇哪』像人在做事，又是拟人。一句里可以两种都有。"}, {"type": "input", "difficulty": 3, "question": "仿写一个比喻句：弯弯的月亮像____。（填一个事物）", "answer": "小船", "explanation": "形状相似才能比：小船、镰刀、眉毛都可以。"}, {"type": "input", "difficulty": 3, "question": "仿写一个拟人句：小溪一路____地跑下山去。（填一个人才有的样子）", "answer": "唱着歌", "explanation": "唱着歌、蹦蹦跳跳、欢笑着都行——把小溪当成人来写。"}, {"type": "choice", "level": "advance", "difficulty": 3, "question": "『秋天的雨，是一把钥匙』和『秋雨吹起了小喇叭』，前者是____，后者是____。", "options": ["比喻、拟人", "拟人、比喻", "都是拟人"], "answer": "A", "explanation": "『是一把钥匙』把秋雨比作钥匙，是比喻；『吹喇叭』是人的动作，是拟人。"}, {"type": "input", "level": "advance", "difficulty": 3, "question": "把『落叶掉下来』改成拟人句：落叶____。（填两个字以上）", "answer": "跳舞", "explanation": "答案不唯一：跳舞、告别、回家都可以，关键是像人。"}, {"type": "input", "level": "challenge", "difficulty": 4, "question": "写一个既有比喻又有拟人的句子描写『白云』（填：白云像____在天上散步）。", "answer": "棉花糖", "explanation": "答案不唯一：棉花糖、羊群都行——『像』是比喻，『散步』是拟人，一句里两样都有。"}]}, {"id": "chinese-tongbian-g3up-u2-kp5", "title": "字词基础：秋天的字词", "short": "拼音与多音字", "difficulty": 2, "sections": ["古诗三首", "铺满金色巴掌的水泥道", "秋天的雨"], "core_concept": "本单元重点：多音字『铺』（pū 铺满／pù 店铺）和『曲』（qū 弯曲／qǔ 歌曲）；『颜料、邮票、规则、棕红』等词语的写法；『加』『勾』的笔顺容易错。", "key_formula": "多音字放进词里记：铺满（pū）／店铺（pù）；弯曲（qū）／歌曲（qǔ）", "common_mistakes": ["把『铺满』的铺读成 pù", "『邮票』写成『邮栗』，『颜料』写成『颜色料』", "『规则』的『则』最后一笔写成捺"], "tips": "多音字不要死记两个音，记住一个词就够：铺满 pū，店铺 pù。", "questions": [{"type": "choice", "difficulty": 2, "question": "『铺满金色巴掌的水泥道』中『铺』的读音是：", "options": ["pū", "pù", "pǔ"], "answer": "A", "explanation": "把东西摊开是 pū（铺满、铺路）；店铺、床铺读 pù。"}, {"type": "choice", "difficulty": 2, "question": "『弯弯曲曲』的『曲』读：", "options": ["qū", "qǔ", "qù"], "answer": "A", "explanation": "弯曲读 qū；歌曲、曲子读 qǔ。"}, {"type": "choice", "difficulty": 1, "question": "秋天的雨有一盒五彩缤纷的____。", "options": ["颜料", "颜色料", "颜药"], "answer": "A", "explanation": "颜料：涂颜色用的材料。课文中秋雨用它把世界染成秋天色。"}, {"type": "choice", "difficulty": 2, "question": "『梧桐树叶像金色的小巴掌』中的『巴掌』指：", "options": ["手掌", "拍打", "梧桐果"], "answer": "A", "explanation": "巴掌就是手掌。梧桐叶的形状像张开的手掌。"}, {"type": "input", "difficulty": 1, "question": "看拼音写词：guī zé（遵守交通______）", "answer": "规则", "explanation": "规则的『则』是立刀旁。"}, {"type": "input", "difficulty": 2, "question": "看拼音写词：yóu piào（一张______）", "answer": "邮票", "explanation": "邮票贴在信封上，别写成『邮栗』。"}, {"type": "choice", "level": "advance", "difficulty": 3, "question": "『铺路』和『店铺』里的两个『铺』，读音：", "options": ["不同：pū 和 pù", "相同", "都是 pù"], "answer": "A", "explanation": "作动词读 pū，作名词读 pù。"}, {"type": "input", "level": "advance", "difficulty": 3, "question": "多音字『曲』：弯曲读 qū，歌曲读____。（填拼音）", "answer": "qǔ", "explanation": "弯曲 qū，歌曲 qǔ。"}, {"type": "input", "level": "challenge", "difficulty": 4, "question": "写出三个描写秋天的四字词语（按「词、词、词」格式填）。", "answer": "秋高气爽、天高云淡、秋风习习", "explanation": "答案不唯一：秋高气爽、天高云淡、秋风习习、五谷丰登都可以。"}]}], "exam": {"title": "第二单元 随堂自测", "duration": 10, "scorePerQuestion": 5, "note": "限时 10 分钟 · 时间到自动交卷", "questions": [{"type": "choice", "question": "『停车坐爱枫林晚』的『坐』意思是：", "options": ["因为", "坐下", "座位"], "answer": "A", "explanation": "古诗文中的『坐爱』即『因为喜爱』。"}, {"type": "input", "question": "《夜书所见》：知有儿童____促织，夜深篱落一灯明。", "answer": "挑", "explanation": "挑读 tiǎo，捉的意思。"}, {"type": "input", "question": "《山行》：停车坐爱枫林晚，____红于二月花。", "answer": "霜叶", "explanation": "霜叶红于二月花。"}, {"type": "choice", "question": "理解『凌乱』用找近义词的方法，最接近的是：", "options": ["杂乱", "整齐", "干净"], "answer": "A", "explanation": "凌乱：不整齐、没有秩序。"}, {"type": "choice", "question": "日记第一行写什么？", "options": ["日期、星期、天气", "题目", "心情"], "answer": "A", "explanation": "日记第一行写日期、星期、天气。"}, {"type": "true_false", "question": "『秋天的雨，吹起了金色的小喇叭』是拟人句。", "answer": "对", "explanation": "雨会吹喇叭，把雨当成人写。"}, {"type": "choice", "question": "『水泥道像铺上了一块彩色的地毯』是：", "options": ["比喻", "拟人", "夸张"], "answer": "A", "explanation": "有『像』，把水泥道比作地毯。"}, {"type": "choice", "question": "『铺满』的『铺』读：", "options": ["pū", "pù", "pǔ"], "answer": "A", "explanation": "铺满读 pū；店铺读 pù。"}, {"type": "input", "question": "看拼音写词：yán liào（五彩缤纷的______）", "answer": "颜料", "exp <script>
(function(){
  const D = DATA;
  const store = {};
  const scoreMap = {};
  let TOTAL = 0;

  /* ───── 易错题本：localStorage 持久化 ───── */
  const WB_KEY = "chinese3.wrongbook.v1";
  const WB_NEED = 3;

  function wbAll(){
    try{ return JSON.parse(localStorage.getItem(WB_KEY) || "{}"); }
    catch(e){ return {}; }
  }
  function wbWrite(o){
    try{ localStorage.setItem(WB_KEY, JSON.stringify(o)); }catch(e){}
  }
  function wbSnap(q){
    return {
      type:q.type, question:q.question, options:q.options||null,
      answer:q.answer, unit:q.unit||"", explanation:q.explanation||"",
      level:q.level||"basic"
    };
  }
  /* 生成同类型变式题：纯算式扰动数字，其余从同知识点题池取 */
  function makeVariant(q){
    const src = String(q.question || "");
    const m = src.match(/([0-9]+(?:\s*[+\-×÷]\s*[0-9]+)+)\s*=\s*（/);
    if(!m) return null;
    const expr = m[1];
    for(let t=0; t<16; t++){
      const nums = expr.match(/[0-9]+/g) || [];
      let ne = expr;
      nums.forEach(function(n){
        const v = parseInt(n,10);
        let nv;
        if(v <= 9) nv = 1 + Math.floor(Math.random()*9);
        else if(v < 100) nv = 10 + Math.floor(Math.random()*90);
        else nv = 100 + Math.floor(Math.random()*800);
        ne = ne.replace(new RegExp("\\b"+n+"\\b"), String(nv));
      });
      if(ne === expr) continue;
      let val;
      try{ val = eval(ne.replace(/×/g,"*").replace(/÷/g,"/")); }catch(e){ continue; }
      if(!isFinite(val) || val <= 0) continue;
      if(Math.abs(val - Math.round(val)) > 1e-9) continue;
      return {
        type: "input", level: "basic",
        question: ne + " =（  ）",
        answer: String(Math.round(val)),
        unit: "",
        explanation: "这是同类型变式题：" + ne + " = " + Math.round(val) + "。原题是「" + src + "」，换一组数字再算一遍。"
      };
    }
    return null;
  }
  function pickFromPool(q, meta){
    const want = meta && meta.kp;
    const isRealKp = (D.knowledgePoints || []).some(function(k){ return k.title === want; });
    const pool = [];
    (D.knowledgePoints || []).forEach(function(kp){
      if(isRealKp && kp.title !== want) return;
      (kp.questions || []).forEach(function(x){ pool.push(x); });
    });
    /* 第一优先：同题型、不同题、非挑战题 */
    const same = pool.filter(function(x){
      return x.type === q.type && x.question !== q.question && x.level !== "challenge";
    });
    if(same.length) return same[Math.floor(Math.random()*same.length)];
    /* 回退：同范围内任意其他选择/判断题——变式的意义是再练一道相关的题，
       避免判断题等题型池子单薄时变式题生成失败 */
    const any = pool.filter(function(x){
      return (x.type === "choice" || x.type === "true_false") && x.question !== q.question;
    });
    if(any.length) return any[Math.floor(Math.random()*any.length)];
    return null;
  }

  function wbRecord(qid, ok, q, meta){
    const all = wbAll();
    const cur = all[qid];
    if(!ok){
      all[qid] = {
        streak: 0,
        wrong: (cur ? (cur.wrong||0) : 0) + 1,
        ts: Date.now(),
        q: wbSnap(q),
        meta: meta || (cur ? cur.meta : {})
      };
      // 首次答错时生成一道同类型题
      const vk = qid + "_v";
      if(!all[vk]){
        let vq = makeVariant(q);
        if(!vq) vq = pickFromPool(q, meta);
        if(vq){
          all[vk] = {
            streak: 0, wrong: 0, ts: Date.now(),
            q: wbSnap(vq),
            meta: meta || {},
            generated: true,
            origin: qid
          };
        }
      }
    } else if(cur){
      cur.streak = (cur.streak||0) + 1;
      cur.ts = Date.now();
      if(cur.streak >= WB_NEED) delete all[qid];
    }
    wbWrite(all);
    wbBadge();
  }
  function wbCount(){ return Object.keys(wbAll()).length; }
  function wbBadge(){
    const b = document.getElementById("wbcount");
    if(!b) return;
    const n = wbCount();
    b.textContent = n ? n : "";
    b.style.display = n ? "" : "none";
  }

  /* ───── 用户资料与星星（取最好成绩，不累加） ───── */
  const PF_KEY = "chinese3.profile.v1";
  const AV_COLORS = ["#2E6BE6","#0E9F6E","#C27803","#7C3AED","#D4537E","#0F766E","#B4460E","#4B5563"];

  function pfAll(){
    try{ return JSON.parse(localStorage.getItem(PF_KEY) || "{}"); }catch(e){ return {}; }
  }
  function pfSave(o){ try{ localStorage.setItem(PF_KEY, JSON.stringify(o)); }catch(e){} }
  function pfGet(k, d){ const p = pfAll(); return p[k]!==undefined ? p[k] : d; }
  function pfSet(k, v){ const p = pfAll(); p[k]=v; pfSave(p); }

  function starId(kind){
    if(D.unitNumber === 0) return "mid";
    if(D.unitNumber === -1) return "final";
    return "u"+D.unitNumber+":"+kind;
  }
  function starsMap(){ const p = pfAll(); return p.stars || {}; }
  function starsFromPct(pct){ return pct < 60 ? 1 : (pct <= 95 ? 2 : 3); }
  function starUpd(id, s){
    const p = pfAll();
    p.stars = p.stars || {};
    const cur = p.stars[id] || 0;
    if(s > cur){ p.stars[id] = s; pfSave(p); }
    renderUserbar();
  }
  function starTotal(){
    const m = starsMap();
    let t = 0;
    for(const k in m) t += m[k] || 0;
    return t;
  }

  function norm(s){
    return String(s).trim()
      .replace(/[\uff10-\uff19]/g, c=>String.fromCharCode(c.charCodeAt(0)-65248))
      .replace(/[\uff0e\uff0c,\s]/g,"").replace(/[\u3000]/g,"");
  }
  function letter(i){ return "ABCDEF"[i]; }
  function diffDots(n){ return "●".repeat(n) + "○".repeat(Math.max(0,4-n)); }
  function el(tag, cls, txt){
    const e=document.createElement(tag);
    if(cls) e.className=cls;
    if(txt!==undefined) e.textContent=txt;
    return e;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* 题目 */
  function renderQ(q, qid, score, adv, idx, meta, mode){
    const lvl = q.level==="advance" ? "adv" : (q.level==="challenge" ? "chal" : "");
    const wrap = el("div", "q" + (lvl?" "+lvl:""));
    wrap.dataset.qid = qid; wrap.dataset.ans = q.answer; wrap.dataset.lvl = lvl;
    wrap.dataset.meta = JSON.stringify(meta || {});
    wrap.dataset.mode = mode || "";
    if(!(qid in scoreMap)){ scoreMap[qid] = score; TOTAL++; }

    const top = el("div","q-top");
    top.innerHTML = '<span class="q-no"></span><span class="q-txt"></span>';
    top.querySelector(".q-no").textContent = idx;
    top.querySelector(".q-txt").textContent = q.question;
    wrap.appendChild(top);

    const fb = el("div","fb");

    if(q.type==="choice" || q.type==="true_false"){
      const box = el("div","opts");
      const vals = q.type==="true_false" ? ["对","错"] : q.options.map((_,i)=>letter(i));
      vals.forEach((v,i)=>{
        const b=el("button","opt");
        b.dataset.val=v;
        b.innerHTML='<b></b><span></span>';
        b.querySelector("b").textContent = q.type==="true_false" ? "" : letter(i);
        b.querySelector("span").textContent = q.type==="true_false" ? v : q.options[i];
        b.onclick = ()=> mode==="quiz" ? pickChoice(box, v, qid) : judgeChoice(box,q,v,fb,wrap,qid);
        box.appendChild(b);
      });
      wrap.appendChild(box);
    } else {
      const row = el("div","inp-row");
      const inp = document.createElement("input");
      inp.type="text"; inp.inputMode="decimal"; inp.placeholder="填答案";
      row.appendChild(inp);
      if(q.unit) row.appendChild(el("span","unit-tag",q.unit));
      if(mode==="quiz"){
        inp.oninput = ()=>{
          quizAns[qid] = inp.value;
          try{ document.dispatchEvent(new Event("quizans")); }catch(e){}
        };
      } else {
        const btn = el("button","btn","检查");
        row.appendChild(btn);
        const go = ()=>judgeInput(inp,btn,q,fb,wrap,qid);
        btn.onclick = go;
        inp.onkeydown = e=>{ if(e.key==="Enter") go(); };
      }
      wrap.appendChild(row);
    }
    wrap.appendChild(fb);
    return wrap;
  }

  function showFb(fb, ok, q){
    fb.className = "fb show " + (ok?"ok":"no");
    let tip = "";
    if(!ok){
      if(q.type==="choice") tip = "正确答案：" + q.answer + "．" + q.options["ABCDEF".indexOf(q.answer)] + "　";
      else if(q.type==="true_false") tip = "正确答案：" + q.answer + "　";
      else tip = "正确答案：" + q.answer + (q.unit||"") + "　";
    }
    fb.innerHTML = '<span class="tk">'+(ok?"\u2713 答对了":"\u2717 再想想")+'</span>' + tip + q.explanation;
  }

  function judgeChoice(box,q,val,fb,wrap,qid){
    const ok = val === q.answer;
    [...box.children].forEach(b=>{
      b.disabled = true;
      if(b.dataset.val === q.answer) b.classList.add("ok");
      else if(b.dataset.val === val && !ok) b.classList.add("no");
    });
    wrap.classList.add(ok?"done":"fail");
    showFb(fb, ok, q);
    store[qid] = ok;
    try{ wbRecord(qid, ok, q, JSON.parse(wrap.dataset.meta||"{}")); }catch(e){}
    updateProgress();
  }

  function judgeInput(inp,btn,q,fb,wrap,qid){
    if(!inp.value.trim()){ inp.focus(); return; }
    const ok = norm(inp.value) === norm(q.answer);
    inp.disabled = true; btn.disabled = true;
    inp.style.borderColor = ok ? "var(--ok)" : "var(--no)";
    inp.style.color = ok ? "var(--ok)" : "var(--no)";
    wrap.classList.add(ok?"done":"fail");
    showFb(fb, ok, q);
    store[qid] = ok;
    try{ wbRecord(qid, ok, q, JSON.parse(wrap.dataset.meta||"{}")); }catch(e){}
    updateProgress();
  }

  /* ───── 限时测验 · 共用部件 ───── */
  const STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.4 6.2 20.4l1.1-6.4L2.6 9.4l6.5-.9z"/></svg>';

  function fmtTime(s){
    const m = Math.floor(s/60), ss = s%60;
    return (m<10?"0":"")+m+":"+(ss<10?"0":"")+ss;
  }

  function buildResultHtml(res){
    let html = '<div class="result"><div class="top">';
    html += '<div class="sc">'+res.main+'<small>'+res.sub+'</small></div>';
    html += '<div class="stars">';
    for(let i=0;i<3;i++) html += '<span class="star'+(i<res.stars?' on':' off')+'">'+STAR_SVG+'</span>';
    html += '</div>';
    html += '<div><div class="lv">'+res.lv+'</div><div class="sub">'+res.line+'</div></div>';
    html += '</div>';

    if(res.wrongs.length){
      html += '<h3>错题分析（'+res.wrongs.length+' 道）</h3><div class="wlist">';
      res.wrongs.forEach(function(w){
        const q = w.q;
        let uaTxt = "未作答";
        if(w.ua!==undefined && String(w.ua).trim()!==""){
          uaTxt = String(w.ua);
          if(q.type==="choice" && /^[A-F]$/.test(uaTxt)){
            uaTxt = uaTxt + "．" + (q.options["ABCDEF".indexOf(uaTxt)]||"");
          }
        }
        let ansTxt = q.answer + (q.unit||"");
        if(q.type==="choice") ansTxt = q.answer + "．" + (q.options["ABCDEF".indexOf(q.answer)]||"");
        html += '<div class="wrow">';
        html += '<div class="q">'+escapeHtml(q.question)+'</div>';
        html += '<div class="ans">你的答案：<span class="bad">'+escapeHtml(uaTxt)+'</span>　正确答案：<span class="good">'+escapeHtml(ansTxt)+'</span></div>';
        if(q.explanation) html += '<div class="exp">'+escapeHtml(q.explanation)+'</div>';
        html += '</div>';
      });
      html += '</div>';
      html += '<div class="sub" style="margin-top:14px">答错的题已收入易错题本，并各生成了一道同类型的新题供你练。</div>';
    } else {
      html += '<h3>全部答对</h3><div class="sub">这一份没有错题。可以去左侧「易错题本」回顾之前积累的题。</div>';
    }
    html += '</div>';
    return html;
  }

  /* 通用限时测验：开始按钮 → 倒计时 → 交卷（时间到自动交卷） */
  function runTimedQuiz(cfg){
    const mount = cfg.mount;
    const ITEMS = cfg.items || [];
    const QN = ITEMS.length;
    const LIMIT = cfg.limit;
    let timer = null, left = LIMIT, started = false, done = false;

    const bar = el("div","quizbar");
    bar.innerHTML =
      '<button class="startbtn" id="'+cfg.id+'Start" type="button">开始'+cfg.name+'</button>' +
      '<div class="meta" id="'+cfg.id+'Meta">'+cfg.intro+'</div>' +
      '<div class="tm" id="'+cfg.id+'Tm" style="display:none">--:--</div>';
    mount.appendChild(bar);

    const body = el("div");
    body.style.display = "none";
    mount.appendChild(body);

    const rbox = el("div");
    rbox.id = cfg.id + "Result";
    mount.appendChild(rbox);

    const tmEl = document.getElementById(cfg.id+"Tm");
    const metaEl = document.getElementById(cfg.id+"Meta");

    /* 供「重置本页」调用：停表、清空作答、回到未开始状态 */
    if(!window.__quizResets) window.__quizResets = [];
    window.__quizResets.push(function(){
      clearInterval(timer);
      started = false; done = false; left = LIMIT;
      body.style.display = "none";
      body.innerHTML = "";
      rbox.innerHTML = "";
      tmEl.textContent = "--:--";
      tmEl.style.display = "none";
      tmEl.classList.remove("warn");
      const sb = document.getElementById(cfg.id+"Start");
      if(sb){ sb.disabled = false; sb.textContent = "开始"+cfg.name; }
      if(metaEl) metaEl.innerHTML = cfg.intro;
      ITEMS.forEach(function(it){ delete quizAns[it.qid]; });
    });

    function paint(){
      if(done) return;
      tmEl.style.display = "";
      tmEl.textContent = fmtTime(Math.max(0,left));
      tmEl.classList.toggle("warn", left<=60);
    }
    document.addEventListener("quizans", function(){
      if(started && !done) countAnswered();
    });

    function countAnswered(){
      let n = 0;
      ITEMS.forEach(function(it){
        const v = quizAns[it.qid];
        if(v!==undefined && String(v).trim()!=="") n++;
      });
      if(metaEl) metaEl.innerHTML = '已答 <b>'+n+'</b> / '+QN+' 题　·　时间到自动交卷';
    }

    function submit(){
      if(!started || done) return;
      done = true;
      clearInterval(timer);
      const sb = document.getElementById(cfg.id+"Submit");
      if(sb){ sb.disabled = true; sb.textContent = "已交卷"; }
      tmEl.classList.remove("warn");
      tmEl.style.display = "";
      tmEl.textContent = "已交卷";

      let right = 0, got = 0, full = 0;
      const wrongs = [];
      ITEMS.forEach(function(it){
        const k = it.qid;
        const ua = quizAns[k];
        const answered = ua!==undefined && String(ua).trim()!=="";
        const ok = answered && norm(ua)===norm(it.q.answer);
        store[k] = ok;
        full += (it.score||0);
        if(ok){ right++; got += (it.score||0); }
        else wrongs.push({q:it.q, ua:ua});
        try{ wbRecord(k, ok, it.q, it.meta||{}); }catch(e){}
      });

      const pct = cfg.scoreMode==="score"
        ? Math.round(got/Math.max(1,full)*100)
        : (QN ? Math.round(right/QN*100) : 0);
      const stars = starsFromPct(pct);
      const lv = stars===3 ? "优秀" : (stars===2 ? "良好" : "待加强");

      if(cfg.starKey) starUpd(cfg.starKey, stars);

      const res = {
        main: cfg.scoreMode==="score" ? got : right,
        sub: cfg.scoreMode==="score" ? ("/ "+full+" 分") : ("/ "+QN),
        stars: stars,
        lv: lv,
        line: cfg.scoreMode==="score"
          ? ("得分 "+got+" / "+full+" 分　·　答对 "+right+" / "+QN+" 题　·　正确率 "+pct+"%")
          : ("正确率 "+pct+"%　·　答对 "+right+" 题，答错 "+wrongs.length+" 题"),
        wrongs: wrongs
      };
      rbox.innerHTML = buildResultHtml(res);
      rbox.scrollIntoView({behavior:"smooth", block:"start"});
      updateProgress();
    }

    document.getElementById(cfg.id+"Start").onclick = function(){
      if(started) return;
      started = true;
      this.disabled = true;
      this.textContent = cfg.name+"中…";
      body.style.display = "";
      cfg.buildBody(body);

      const sb = el("button","startbtn","交卷");
      sb.id = cfg.id+"Submit";
      sb.type = "button";
      sb.style.background = "#0E9F6E";
      sb.style.boxShadow = "0 4px 14px rgba(14,159,110,.28)";
      sb.style.marginTop = "20px";
      sb.onclick = submit;
      body.appendChild(sb);

      paint();
      countAnswered();
      timer = setInterval(function(){
        left--;
        paint();
        countAnswered();
        if(left<=0) submit();
      }, 1000);
    };
  }

  /* ───── 随堂自测：限时测验 ───── */
  if(D.exam){
    const ex = document.getElementById("exam");
    const QN = D.exam.questions.length;
    const LIMIT = QN * 60;

    const eh = el("div","bhead");
    eh.innerHTML = '<h2></h2><div class="bsub"></div>';
    eh.querySelector("h2").textContent = D.exam.title;
    eh.querySelector(".bsub").innerHTML =
      '<span>共 '+QN+' 题</span><span>限时 '+Math.round(LIMIT/60)+' 分钟</span>' +
      '<span>时间到自动交卷</span><span>'+((D.exam.note)||"自主练习")+'</span>';
    ex.appendChild(eh);

    runTimedQuiz({
      mount: ex,
      id: "exam",
      name: "测试",
      intro: '共 <b>'+QN+'</b> 题，按每题 1 分钟计算，限时 <b>'+Math.round(LIMIT/60)+'</b> 分钟',
      limit: LIMIT,
      starKey: starId("exam"),
      scoreMode: "count",
      items: D.exam.questions.map(function(q, i){
        return {q:q, qid:"ex_"+i, score:(D.exam.scorePerQuestion||5),
                meta:{u:D.unitNumber, ut:D.unitTitle, kp:"随堂自测"}};
      }),
      buildBody: function(body){
        D.exam.questions.forEach(function(q, i){
          body.appendChild(renderQ(q, "ex_"+i, D.exam.scorePerQuestion||5, false, i+1,
            {u:D.unitNumber, ut:D.unitTitle, kp:"随堂自测"}, "quiz"));
        });
      }
    });
  }

  /* ───── 检测卷：单元检测 / 期中 / 期末，同样是限时测验 ───── */
  if(D.paper){
    const P = D.paper;
    const SECS = P.sections || [];
    const box = document.getElementById("paper");

    const cover = el("div","paper-cover");
    cover.innerHTML = '<div class="eyebrow">'+ (D.unitNumber <= 0 ? "阶段检测" : "单元检测") +'</div>' +
      '<h2></h2><div class="sub"></div><div class="paper-meta"></div>';
    cover.querySelector("h2").textContent = P.title;
    cover.querySelector(".sub").textContent = P.subtitle || "";

    const items = [];
    SECS.forEach(function(sec, si){
      (sec.questions||[]).forEach(function(q, qi){
        items.push({q:q, qid:"pa_"+si+"_"+qi, score:(sec.perScore||0),
                    meta:{u:D.unitNumber, ut:D.unitTitle, kp:sec.name}});
      });
    });
    const LIMIT = (P.duration || Math.max(20, Math.round(items.length*1.6))) * 60;

    /* 提前登记卷面题目，让总进度从一开始就是整册量，不会因开始测验而跳变 */
    items.forEach(function(it){
      if(!(it.qid in scoreMap)){ scoreMap[it.qid] = it.score; TOTAL++; }
    });

    cover.querySelector(".paper-meta").innerHTML =
      '<span>满分 '+P.totalScore+' 分</span><span>限时 '+Math.round(LIMIT/60)+' 分钟</span>' +
      '<span>共 '+items.length+' 题</span><span>时间到自动交卷</span>';
    box.appendChild(cover);

    runTimedQuiz({
      mount: box,
      id: "paper",
      name: "检测",
      intro: '点「开始检测」后开始计时，中途可提前交卷 · 共 <b>'+items.length+'</b> 题',
      limit: LIMIT,
      starKey: starId("paper"),
      scoreMode: "score",
      items: items,
      buildBody: function(body){
        SECS.forEach(function(sec, si){
          const s = el("div","paper-sec");
          const title = el("div","p-sec-title");
          title.innerHTML = '<span></span><span class="ps"></span>';
          title.querySelector("span").textContent = sec.name;
          title.querySelector(".ps").textContent =
            "每题 "+sec.perScore+" 分，共 "+(sec.perScore*(sec.questions||[]).length)+" 分";
          s.appendChild(title);
          (sec.questions||[]).forEach(function(q, qi){
            s.appendChild(renderQ(q, "pa_"+si+"_"+qi, sec.perScore, false, qi+1,
              {u:D.unitNumber, ut:D.unitTitle, kp:sec.name}, "quiz"));
          });
          body.appendChild(s);
        });
      }
    });
  }

  /* 侧栏折叠 */
  (function(){
    const lay = document.getElementById("layout");
    const btn = document.getElementById("sideToggle");
    if(!lay || !btn) return;
    btn.onclick = function(){
      lay.classList.toggle("side-off");
      btn.textContent = lay.classList.contains("side-off") ? "\u25b6" : "\u25c0";
    };
  })();

  /* 视频展开 / 收起 */
  (function(){
    const head = document.getElementById("vhead");
    const grid = document.getElementById("vlist");
    const tg = document.getElementById("vtg");
    if(!head || !grid || !tg) return;
    head.onclick = function(){
      const hidden = grid.classList.toggle("hide");
      tg.textContent = hidden ? "\u5c55\u5f00 \u25be" : "\u6536\u8d77 \u25b4";
    };
  })();

  /* 分区切换：知识点 / 随堂自测 / 单元检测卷（入口在左侧目录树） */
  (function(){
    function showPane(p, navKey){
      document.querySelectorAll(".pane").forEach(x=>x.classList.toggle("show", x.id==="pane-"+p));
      markSub(navKey || (p==="kp" ? "kp"+curKp : p));
      window.scrollTo({top:0, behavior:"smooth"});
    }
    window.showPane = showPane;

    /* 没有知识点的页（期中 / 期末）直接落到卷面 */
    if(!D.knowledgePoints.length){
      showPane(D.paper ? "paper" : "exam");
    }
  })();

  /* 上下单元 */
  (function(){
    const box=document.getElementById("unitnav"); if(!box||!BOOK.units) return;
    const cur=D.unitNumber; let prev=null, next=null;
    BOOK.units.forEach(u=>{ if(u.n===cur-1) prev=u; if(u.n===cur+1) next=u; });
    box.innerHTML =
      (prev ? '<a href="u'+prev.n+'.html"><span class="k">上一单元</span>'+prev.t+'</a>'
            : '<a href="index.html"><span class="k">返回</span>整册总览</a>') +
      (next ? '<a class="next" href="u'+next.n+'.html"><span class="k">下一单元</span>'+next.t+'</a>'
            : '<a class="next" href="index.html"><span class="k">返回</span>整册总览</a>');
  })();

  document.getElementById("reset").onclick = ()=>{
    if(!confirm("确定清空本页所有作答记录？")) return;
    for(const k in store) delete store[k];
    document.querySelectorAll(".q").forEach(x=>{
      x.className = "q" + (x.dataset.lvl ? " "+x.dataset.lvl : "");
      const fb=x.querySelector(".fb"); if(fb) fb.className="fb";
      x.querySelectorAll(".opt").forEach(o=>{ o.disabled=false; o.classList.remove("ok","no"); });
      const inp=x.querySelector("input");
      if(inp){ inp.disabled=false; inp.value=""; inp.style.borderColor=""; inp.style.color=""; }
      const btn=x.querySelector(".btn"); if(btn) btn.disabled=false;
    });
    if(window.__quizResets) window.__quizResets.forEach(fn=>{ try{ fn(); }catch(e){} });
    updateProgress();
  };

  renderUserbar();
  updateProgress();
})();
</script>
</body>
</html>
