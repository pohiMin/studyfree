<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>易错题本 · 三年级语文</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#EFF2F6; --card:#FFFFFF; --soft:#F7F9FC;
    --ink:#141B2D; --ink2:#48536B; --ink3:#8B95AB;
    --line:#E3E8F0; --line2:#CBD3E1;
    --pri:#2E6BE6; --pri-l:#EAF1FE; --pri-d:#1B4BB8;
    --ok:#0E9F6E; --ok-l:#E8F8F2;
    --no:#E02424; --no-l:#FDECEC;
    --warn:#C27803; --warn-l:#FFF7E6; --warn-b:#FBE3B0;
  }
  html{font-size:17px}
  @media(min-width:761px) and (max-width:1120px){ html{font-size:18.5px} }
  @media(max-width:900px){ html{font-size:18px} }
  @media(pointer:coarse){ .opt{padding:14px 16px} .btn{padding:12px 24px} .sitem{padding:11px 12px} }
  body{background:var(--bg);color:var(--ink);line-height:1.75;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .layout{display:flex;align-items:flex-start}

  .side{flex:0 0 258px;width:258px;position:sticky;top:0;height:100vh;overflow-y:auto;
    padding:26px 14px 40px;border-right:1px solid var(--line);background:#F9FBFD}
  .side::-webkit-scrollbar{width:5px}
  .side::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
  .brand{display:block;text-decoration:none;color:var(--ink);padding:0 10px 18px}
  .brand .b1{font-size:1.06rem;font-weight:700;line-height:1.4}
  .brand .b2{font-size:.72rem;color:var(--ink3);margin-top:2px}
  .sitem{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink2);
    border-radius:10px;padding:9px 10px;font-size:.9rem;line-height:1.45;transition:.14s;margin-bottom:2px}
  .sitem:hover{background:#EDF2FA;color:var(--ink)}
  .sitem .n{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:#E7EDF8;color:#5A6B87;
    font-size:.72rem;font-weight:700;display:grid;place-items:center}
  .sitem .t{flex:1;min-width:0}
  .sitem.on{background:var(--pri);color:#fff;font-weight:600}
  .sitem.on .n{background:rgba(255,255,255,.22);color:#fff}
  .sback{display:block;margin:14px 10px 0;font-size:.78rem;color:var(--ink3);text-decoration:none}
  .sback:hover{color:var(--pri)}

  .main{flex:1;min-width:0;padding:26px 30px 90px 26px}
  .frame{background:var(--card);border-radius:22px;padding:34px 38px 40px;
    max-width:900px;margin:0 auto;box-shadow:0 1px 3px rgba(20,27,45,.05),0 8px 28px rgba(20,27,45,.04)}

  .kick{font-size:.76rem;font-weight:700;color:var(--pri);letter-spacing:1.4px;margin-bottom:8px}
  h1{font-size:1.7rem;font-weight:700;letter-spacing:-.4px;line-height:1.4}
  .lead{margin-top:12px;font-size:.92rem;color:var(--ink2);line-height:1.85}
  .lead b{color:var(--ink)}
  .stat{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
  .stat .box{background:var(--soft);border:1px solid var(--line);border-radius:12px;
    padding:11px 17px;font-size:.8rem;color:var(--ink2)}
  .stat .box b{display:block;font-size:1.35rem;color:var(--pri);line-height:1.3;font-weight:700}

  .grp{margin-top:34px}
  .grp-h{font-size:.78rem;font-weight:700;color:var(--ink3);letter-spacing:1px;
    padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .grp-h .from{font-weight:400;color:var(--ink3);letter-spacing:0;margin-left:8px}

  .q{padding:18px 0;border-bottom:1px dashed #E9EDF4}
  .q:last-child{border-bottom:none}
  .q-top{display:flex;gap:11px;align-items:flex-start;margin-bottom:12px}
  .vgen{display:inline-block;font-size:.68rem;font-weight:700;color:#B4460E;background:#FFF0E6;
    border-radius:5px;padding:2px 8px;margin-bottom:9px;letter-spacing:.3px}
  .q-no{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#FDE8E8;color:#C81E1E;
    font-size:.78rem;font-weight:700;display:grid;place-items:center;margin-top:2px}
  .q.done .q-no{background:var(--ok);color:#fff}
  .q-txt{font-size:1rem;line-height:1.8;flex:1}
  .streak{font-size:.72rem;color:var(--ink3);margin-top:8px;display:flex;align-items:center;gap:7px}
  .pips{display:flex;gap:4px}
  .pip{width:20px;height:6px;border-radius:3px;background:#E3E8F0}
  .pip.on{background:var(--ok)}

  .opts{display:flex;flex-direction:column;gap:8px;margin-left:37px}
  .opt{text-align:left;font:inherit;font-size:.94rem;color:var(--ink2);background:#fff;
    border:1.5px solid var(--line2);border-radius:10px;padding:11px 15px;cursor:pointer;
    display:flex;gap:11px;align-items:flex-start;transition:.14s;line-height:1.7}
  .opt:hover:not(:disabled){border-color:var(--pri);background:var(--pri-l)}
  .opt b{color:var(--ink3);font-weight:700;flex:0 0 auto}
  .opt:disabled{cursor:default}
  .opt.ok{border-color:var(--ok);background:var(--ok-l);color:#08694A}
  .opt.ok b{color:var(--ok)}
  .opt.no{border-color:var(--no);background:var(--no-l);color:#9B1C1C}
  .opt.no b{color:var(--no)}

  .inp-row{display:flex;gap:9px;margin-left:37px;align-items:center;flex-wrap:wrap}
  .inp-row input{font:inherit;font-size:1rem;width:130px;padding:10px 14px;border:1.5px solid var(--line2);
    border-radius:10px;outline:none;color:var(--ink)}
  .inp-row input:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(46,107,230,.12)}
  .inp-row .unit-tag{font-size:.92rem;color:var(--ink3)}
  .btn{font:inherit;font-size:.88rem;font-weight:600;padding:9px 20px;border-radius:10px;
    cursor:pointer;border:1.5px solid var(--pri);background:var(--pri);color:#fff}
  .btn:hover{background:var(--pri-d)}
  .btn:disabled{background:#E6EAF1;border-color:#E6EAF1;color:#9AA5B8;cursor:default}

  .fb{margin:11px 0 0 37px;font-size:.9rem;line-height:1.8;border-radius:10px;padding:11px 15px;display:none}
  .fb.show{display:block}
  .fb.ok{background:var(--ok-l);color:#08694A;border-left:4px solid var(--ok)}
  .fb.no{background:var(--no-l);color:#9B1C1C;border-left:4px solid var(--no)}
  .fb .tk{font-weight:700;margin-right:6px}

  .empty{text-align:center;padding:60px 20px}
  .empty .big{font-size:2.4rem;line-height:1;color:var(--ok);margin-bottom:16px}
  .empty h2{font-size:1.25rem;font-weight:700;margin-bottom:10px}
  .empty p{font-size:.92rem;color:var(--ink2);line-height:1.9}
  .empty a{display:inline-block;margin-top:22px;background:var(--pri);color:#fff;text-decoration:none;
    border-radius:11px;padding:12px 26px;font-size:.92rem;font-weight:600}

  .cleared{animation:out .45s ease forwards}
  @keyframes out{to{opacity:0;transform:translateX(14px);height:0;padding:0;border:0;overflow:hidden}}

  @media(max-width:900px){
    .layout{display:block}
    .side{position:static;width:auto;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:14px 12px}
    .main{padding:16px 12px 70px}
    .frame{padding:22px 18px 26px;border-radius:14px}
    .opts,.inp-row,.fb{margin-left:0}
  }
</style>
<script>/* 登录门禁：未登录先隐藏内容再跳登录页（防闪现） */
(function(){
  var s=null;
  try{ s=JSON.parse(localStorage.getItem("studyfree.session.v1")||"null"); }catch(e){}
  if(!s || !s.name){
    document.documentElement.style.visibility="hidden";
    location.replace("../../login.html?next=" + encodeURIComponent(location.pathname));
  }
})();</script>
</head>
<body>
<div class="layout">
  <aside class="side">
    <a class="brand" href="index.html">
      <div class="b1">三年级语文</div>
      <div class="b2">统编版 · 上册</div>
    </a>
    <div id="snav"></div>
    <a class="sback" href="index.html">← 整册总览</a>
  </aside>

  <main class="main">
    <div class="frame">
      <div class="kick">专项复习</div>
      <h1>易错题本</h1>
      <div class="lead" id="lead"></div>
      <div class="stat" id="stat"></div>
      <div id="list"></div>
      <div id="emptyBox"></div>
    </div>
  </main>
</div>

<script>const __USER = (function(){ try{ var s=JSON.parse(localStorage.getItem("studyfree.session.v1")||"null"); return (s&&s.name)? String(s.name).replace(/[^0-9A-Za-z\u4e00-\u9fff]/g,"").slice(0,12) : ""; }catch(e){ return ""; } })();</script>
<script>const BOOK = {"title": "统编版 · 语文 · 三年级上册", "edition": "2025 年 6 月第 1 版（2026 年 7 月第 2 次印刷）", "isbn": "978-7-107-39754-7", "intro": "<b>怎么用：</b>按单元顺序往下走，每个单元先看知识点讲解，再做题。答错的题会立刻给出解析，错的字要动手写一遍，不要只看。<br><b>顺序建议：</b>第二、七单元（六首古诗）要背熟默对；第三单元是阅读策略单元，练的是“预测要有依据”，不是背故事；第六、七单元的“找关键句、围绕一个意思写”是习作地基；第八单元第一次学文言文，先读通再理解。<br><b>说明：</b>本页所有练习均为自主练习，不计排名、不设考试。", "units": [{"n": 1, "t": "学校生活"}, {"n": 2, "t": "金秋时节"}, {"n": 3, "t": "预测"}, {"n": 4, "t": "童话世界"}, {"n": 5, "t": "留心观察"}, {"n": 6, "t": "祖国山河"}, {"n": 7, "t": "自然之美"}, {"n": 8, "t": "美好品质"}], "totalQ": 664, "hasMidterm": true, "hasFinal": true};</script>
<script>
(function(){
  const WB_KEY = "chinese3.wrongbook.v1" + (__USER ? "." + __USER : "");
  const WB_NEED = 3;

  function wbAll(){
    try{ return JSON.parse(localStorage.getItem(WB_KEY) || "{}"); }
    catch(e){ return {}; }
  }
  function wbWrite(o){
    try{ localStorage.setItem(WB_KEY, JSON.stringify(o)); }catch(e){}
  }
  function norm(s){
    return String(s).trim()
      .replace(/[\uff10-\uff19]/g, c=>String.fromCharCode(c.charCodeAt(0)-65248))
      .replace(/[\uff0e\uff0c,\s]/g,"").replace(/[\u3000]/g,"");
  }
  function el(t,c,x){ const e=document.createElement(t); if(c)e.className=c; if(x!==undefined)e.textContent=x; return e; }

  /* 侧栏 */
  (function(){
    const nav = document.getElementById("snav");
    (BOOK.units||[]).forEach(u=>{
      const a = el("a","sitem");
      a.href = "u"+u.n+".html";
      a.innerHTML = '<span class="n"></span><span class="t"></span>';
      a.querySelector(".n").textContent = u.n;
      a.querySelector(".t").textContent = u.t;
      nav.appendChild(a);
    });
    if(BOOK.hasMidterm){
      const m = el("a","sitem");
      m.href="midterm.html";
      m.innerHTML='<span class="n" style="background:#E7EDF8;color:#5A6B87;font-size:.66rem">期</span><span class="t">期中检测</span>';
      nav.appendChild(m);
    }
    if(BOOK.hasFinal){
      const f = el("a","sitem");
      f.href="final.html";
      f.innerHTML='<span class="n" style="background:#E7EDF8;color:#5A6B87;font-size:.66rem">终</span><span class="t">期末检测卷</span>';
      nav.appendChild(f);
    }
    const r = el("a","sitem on");
    r.href="review.html";
    r.innerHTML='<span class="n" style="background:rgba(255,255,255,.22);color:#fff;font-size:.66rem">错</span><span class="t">易错题本</span>';
    nav.appendChild(r);
  })();

  function render(){
    const all = wbAll();
    const ids = Object.keys(all);
    const list = document.getElementById("list");
    const emptyBox = document.getElementById("emptyBox");
    const stat = document.getElementById("stat");
    const lead = document.getElementById("lead");

    list.innerHTML = ""; emptyBox.innerHTML = "";

    lead.innerHTML = "做错的题会自动收进来。<b>同一道题连续答对 " + WB_NEED +
      " 次</b>，就说明真会了，自动移出。中途再错一次，连对次数重新算。";
    stat.innerHTML =
      '<div class="box"><b>'+ids.length+'</b>待攻克</div>' +
      '<div class="box"><b>'+ids.filter(k=>all[k].streak>0).length+'</b>已连对 1 次以上</div>';

    if(!ids.length){
      emptyBox.innerHTML =
        '<div class="empty"><div class="big">\u2713</div><h2>没有待攻克的错题</h2>' +
        '<p>要么还没开始做题，要么之前的错题都已经连续答对 ' + WB_NEED + ' 次、成功移出了。</p>' +
        '<a href="index.html">去选一个单元</a></div>';
      return;
    }

    /* 按来源分组 */
    const groups = {};
    ids.forEach(k=>{
      const m = all[k].meta || {};
      const key = (m.ut || "未分组") + (m.kp ? " · " + m.kp : "");
      (groups[key] = groups[key] || []).push(k);
    });

    const order = Object.keys(groups).sort();
    let n = 0;
    order.forEach(gname=>{
      const g = el("div","grp");
      const h = el("div","grp-h");
      h.textContent = gname;
      h.innerHTML += '<span class="from">'+groups[gname].length+' 题</span>';
      g.appendChild(h);

      groups[gname].forEach(qid=>{
        n++;
        g.appendChild(buildQ(qid, all[qid], n));
      });
      list.appendChild(g);
    });
  }

  function buildQ(qid, item, idx){
    const q = item.q;
    const wrap = el("div","q");
    wrap.dataset.qid = qid;
    wrap.dataset.ans = q.answer;

    if(item.generated){
      wrap.appendChild(el("div","vgen","变式题 · 由原错题自动生成"));
    }

    const top = el("div","q-top");
    top.innerHTML = '<span class="q-no"></span><span class="q-txt"></span>';
    top.querySelector(".q-no").textContent = idx;
    top.querySelector(".q-txt").textContent = q.question;
    wrap.appendChild(top);

    const st = el("div","streak");
    st.innerHTML = '<span>连对</span><span class="pips"></span><span class="cnt"></span>';
    wrap.appendChild(st);
    paintStreak(st, item.streak || 0);

    const fb = el("div","fb");

    if(q.type==="choice" || q.type==="true_false"){
      const box = el("div","opts");
      const vals = q.type==="true_false" ? ["对","错"] : q.options.map((_,i)=>"ABCDEF"[i]);
      vals.forEach((v,i)=>{
        const b = el("button","opt");
        b.type="button"; b.dataset.val=v;
        b.innerHTML='<b></b><span></span>';
        b.querySelector("b").textContent = q.type==="true_false" ? "" : "ABCDEF"[i];
        b.querySelector("span").textContent = q.type==="true_false" ? v : q.options[i];
        b.onclick = ()=>judge(box, q, v, fb, wrap, qid, null);
        box.appendChild(b);
      });
      wrap.appendChild(box);
    } else {
      const row = el("div","inp-row");
      const inp = document.createElement("input");
      inp.type="text"; inp.inputMode="decimal"; inp.placeholder="填答案";
      const btn = el("button","btn","检查");
      row.appendChild(inp);
      if(q.unit) row.appendChild(el("span","unit-tag",q.unit));
      row.appendChild(btn);
      const go = ()=>judge(null, q, inp.value, fb, wrap, qid, inp);
      btn.onclick = go;
      inp.onkeydown = e=>{ if(e.key==="Enter") go(); };
      wrap.appendChild(row);
    }

    wrap.appendChild(fb);
    return wrap;
  }

  function paintStreak(st, s){
    const pips = st.querySelector(".pips");
    pips.innerHTML = "";
    for(let i=0;i<WB_NEED;i++){
      pips.appendChild(el("span", "pip" + (i<s ? " on" : "")));
    }
    st.querySelector(".cnt").textContent = s ? ("已连对 "+s+" / "+WB_NEED) : ("还未连对，答对 "+WB_NEED+" 次移出");
  }

  function judge(box, q, val, fb, wrap, qid, inp){
    const all = wbAll();
    const cur = all[qid];
    if(!cur) return;

    const ok = (box ? val === q.answer : norm(val) === norm(q.answer));
    if(!ok){ inp && inp.focus(); if(!val.trim()) return; }

    if(box){
      [...box.children].forEach(b=>{
        b.disabled = true;
        if(b.dataset.val === q.answer) b.classList.add("ok");
        else if(b.dataset.val === val && !ok) b.classList.add("no");
      });
    } else {
      inp.disabled = true;
      wrap.querySelector(".btn").disabled = true;
      inp.style.borderColor = ok ? "var(--ok)" : "var(--no)";
      inp.style.color = ok ? "var(--ok)" : "var(--no)";
    }

    fb.className = "fb show " + (ok?"ok":"no");

    if(ok){
      cur.streak = (cur.streak||0) + 1;
      cur.ts = Date.now();
      if(cur.streak >= WB_NEED){
        delete all[qid];
        wrap.classList.add("done");
        fb.innerHTML = '<span class="tk">\u2713 答对了</span>连续答对 '+WB_NEED+' 次，这道题已移出错题本。' + (q.explanation||"");
        setTimeout(()=>{ wrap.classList.add("cleared"); setTimeout(render, 460); }, 1600);
      } else {
        all[qid] = cur;
        wrap.classList.add("done");
        paintStreak(wrap.querySelector(".streak"), cur.streak);
        fb.innerHTML = '<span class="tk">\u2713 答对了</span>再答对 <b>'+(WB_NEED-cur.streak)+
          '</b> 次就能移出。' + (q.explanation||"");
      }
    } else {
      cur.streak = 0;
      cur.wrong = (cur.wrong||0) + 1;
      cur.ts = Date.now();
      all[qid] = cur;
      paintStreak(wrap.querySelector(".streak"), 0);
      let tip = "";
      if(q.type==="choice") tip = "正确答案：" + q.answer + "．" + q.options["ABCDEF".indexOf(q.answer)] + "　";
      else if(q.type==="true_false") tip = "正确答案：" + q.answer + "　";
      else tip = "正确答案：" + q.answer + (q.unit||"") + "　";
      fb.innerHTML = '<span class="tk">\u2717 又错了一次</span>' + tip + (q.explanation||"") +
        '<br><span style="font-size:.82rem">连对次数已清零，重新开始累计。</span>';
    }

    wbWrite(all);
  }

  render();
})();
</script>
</body>
</html>
